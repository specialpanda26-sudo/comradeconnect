name: Build Android APK

# Run it by hand: GitHub > Actions > Build Android APK > Run workflow.
# The finished app appears under Releases (and as a download on the run page).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-wrapper
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pack the website into the app
        run: VERSION_NAME=1.0.${{ github.run_number }} python3 bundle.py

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Permissions, version, icons
        run: |
          pip install --quiet pillow
          VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.0.${{ github.run_number }} python3 prepare.py

      - name: Build and sign
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out ../comrade-connect.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../comrade-connect.apk
            echo "Signed with your own key. New versions install over old ones." >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../comrade-connect.apk
            echo "WARNING: no signing key set, so this APK uses a temporary key. It installs fine, but you must uninstall the old app before installing the next build. See android-wrapper/README.md to set up a permanent key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: comrade-connect-apk
          path: android-wrapper/comrade-connect.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Comrade Connect app ${{ github.run_number }}
          body: Install comrade-connect.apk on your Android phone. Allow "Install unknown apps" for your browser when asked.
          make_latest: true
          files: android-wrapper/comrade-connect.apk
