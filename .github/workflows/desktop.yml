name: Build desktop apps

# Builds Comrade Connect for Windows, Mac and Linux. Runs by itself on every push that changes the website or desktop/ files,
# and by hand: GitHub > Actions > Build desktop apps > Run workflow.
# The files join the same Release as the Android app, so the website's Download sheet always finds the newest ones.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the website inside the app (offline copy)
        shell: bash
        run: |
          mkdir -p desktop/site
          cp -r frontend/. desktop/site/
          cp frontend/icon-512.png desktop/icon.png
          rm -f desktop/site/media/bg-4k.mp4 desktop/site/admin*.html desktop/site/admin-*.js   # keep the installer small

      - name: Build the app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    # Publish whatever was built, even if one computer type failed (for example Mac),
    # so a Mac problem can never stop the Windows download from appearing.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files

      - name: Check there is something to publish
        run: |
          ls -la files || true
          ls files/* >/dev/null 2>&1 || { echo "No desktop files were built, nothing to publish."; exit 1; }

      # One fixed release, "desktop-latest": the website's Windows/Mac/Linux buttons always point here,
      # so they never depend on the Android release being ready at the same moment. Files are replaced on every build.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Comrade Connect desktop apps (latest)
          body: Windows, Mac and Linux apps. The newest build replaces the files here. Android is under the app-NNN releases.
          make_latest: false
          overwrite_files: true
          files: files/*
