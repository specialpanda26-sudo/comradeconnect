name: Build desktop apps

# Builds Comrade Connect for Windows, Mac and Linux. Runs by itself on every push that changes the website or desktop/ files,
# and by hand: GitHub > Actions > Build desktop apps > Run workflow.
# The files join the same Release as the Android app, so the website's Download sheet always finds the newest ones.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Put the website inside the app (offline copy)
        shell: bash
        run: |
          mkdir -p desktop/site
          cp -r frontend/. desktop/site/
          cp frontend/icon-512.png desktop/icon.png

      - name: Build the app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build number
        run: echo "BUILD_N=$(( $(git rev-list --count HEAD) + 100 ))" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ env.BUILD_N }}
          name: Comrade Connect app ${{ env.BUILD_N }}
          make_latest: true
          files: files/*
