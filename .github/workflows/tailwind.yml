name: Build site CSS

# Makes frontend/tw.css (the Tailwind classes the site uses) and frontend/cc-all.css (all page styles in one file)
# and saves them in the repo. Runs by itself when pages, scripts or stylesheets change.
# Manual run: GitHub > Actions > Build site CSS > Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**/*.html'
      - 'frontend/**/*.js'
      - 'frontend/**/*.css'
      - 'scripts/merge-css.py'
      - 'scripts/css-order.txt'
      - 'tailwind.config.cjs'
      - 'tailwind/input.css'
      - '.github/workflows/tailwind.yml'

concurrency:
  group: tailwind-css
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  css:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tw.css
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind/input.css -o frontend/tw.css --minify
      - name: Merge the stylesheets into cc-all.css
        run: python3 scripts/merge-css.py
      - name: Make the link-preview picture (only if missing)
        run: |
          if [ ! -f frontend/comrade-connect-all-universities.png ]; then
            pip install --quiet pillow
            python3 scripts/make-share-image.py
          fi
      - name: Save the new files if anything changed
        run: |
          git add -A frontend
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild tw.css and cc-all.css [skip ci]"
          git pull --rebase origin main
          git push
