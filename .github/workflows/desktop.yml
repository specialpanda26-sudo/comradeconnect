name: Build desktop apps

# cc-manual-only: this no longer runs on every push (it was using up build minutes).
# Builds Comrade Connect for Windows, Mac and Linux. Runs by hand only: GitHub > Actions > Build desktop apps > Run workflow.
# The files join the same Release as the Android app, so the website's Download sheet always finds the newest ones.
on:
  workflow_dispatch:

concurrency:
  group: desktop-app
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  names:
    # Windows cannot even download a repo that holds a file name with a quote, colon, ? or * in it. This says so in plain words.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check file names are valid on Windows
        run: |
          bad=$(git ls-files | grep -E '[":<>|*?]' || true)
          if [ -n "$bad" ]; then echo "These file names break the Windows build. Rename or delete them:"; echo "$bad"; exit 1; fi
          echo "All file names are fine."

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build tw.css for the app
        shell: bash
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i tailwind/input.css -o frontend/tw.css --minify

      - name: Put the website inside the app (offline copy)
        shell: bash
        run: |
          mkdir -p desktop/site
          cp -r frontend/. desktop/site/
          cp frontend/icon-512.png desktop/icon.png
          rm -f desktop/site/media/bg-4k.mp4 desktop/site/admin*.html desktop/site/admin-*.js   # keep the installer small

      - name: Build the app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    env:
      PUB_REPO: ${{ vars.RELEASES_REPO }}
      PUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    # Publish whatever was built, even if one computer type failed (for example Mac),
    # so a Mac problem can never stop the Windows download from appearing.
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: files

      - name: Check there is something to publish
        run: |
          ls -la files || true
          ls files/* >/dev/null 2>&1 || { echo "No desktop files were built, nothing to publish."; exit 1; }

      # One fixed release, "desktop-latest": the website's Windows/Mac/Linux buttons always point here,
      # so they never depend on the Android release being ready at the same moment. Files are replaced on every build.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Comrade Connect desktop apps (latest)
          body: Windows, Mac and Linux apps. The newest build replaces the files here. Android is under the app-NNN releases.
          make_latest: false
          overwrite_files: true
          files: files/*

      # Optional copy to a PUBLIC releases repo (needed when this repo is private: visitors without GitHub get a 404 otherwise).
      # Turn on by adding repo variable RELEASES_REPO (e.g. specialpanda26-sudo/comradeconnect-releases) and secret RELEASES_TOKEN.
      - uses: softprops/action-gh-release@v2
        if: ${{ env.PUB_REPO != '' && env.PUB_TOKEN != '' }}
        with:
          repository: ${{ env.PUB_REPO }}
          token: ${{ env.PUB_TOKEN }}
          tag_name: desktop-latest
          name: Comrade Connect desktop apps (latest)
          body: Windows, Mac and Linux apps.
          make_latest: false
          overwrite_files: true
          files: files/*
