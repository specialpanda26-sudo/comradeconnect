# Render Blueprint for the API only (your static site stays as it is).
# New > Blueprint > pick this repo. Fill the sync:false values when Render asks.
services:
  - type: web
    name: comradeconnect-api
    runtime: node
    plan: starter            # free plan sleeps after 15 min idle and the first request waits ~50 s; starter ($7/mo) stays awake
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: ALLOWED_ORIGINS, value: "https://comradeconnect.co.ke,https://www.comradeconnect.co.ke,https://localhost" }
      - { key: PAYMENT_MODE, value: tinypesa }   # "manual" = free, you confirm codes by hand
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_SERVICE_KEY, sync: false }
      - { key: ADMIN_KEY, sync: false }
      - { key: HASH_PEPPER, sync: false }
      - { key: CRON_SECRET, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: TINYPESA_API_KEY, sync: false }   # TinyPesa link API key (the one shown with a link username)
      - { key: TINYPESA_USERNAME, sync: false }  # the link username that goes with the link API key
      - { key: CALLBACK_SECRET, sync: false }    # same string you put after ?s= in the TinyPesa callback URL
      - { key: MAIL_FROM, sync: false }          # e.g. Comrade Connect <noreply@comradeconnect.co.ke>. Needed for Forgot password (verified sender in Brevo or Resend)
      - { key: BREVO_API_KEY, sync: false }      # starts with xkeysib- . Use this OR RESEND_API_KEY. Without one of them Forgot password answers "not switched on yet"
      - { key: RESEND_API_KEY, sync: false }
      - { key: AGORA_APP_ID, sync: false }            # Agora Console > your project > App ID (same value as CC_AGORA_ID in frontend/config.js)
      - { key: AGORA_APP_CERTIFICATE, sync: false }   # Agora Console > your project > Primary Certificate. Secret: server only. Needed for Go Live when the certificate is switched on
      - { key: DEVICE_LOCK, value: "1" }
      - { key: DEVICE_MAX_ACCOUNTS, value: "3" }
      - { key: PASSKEY_RP_ID, value: comradeconnect.co.ke }
      - { key: MPESA_PAY_TYPE, value: send }
      - { key: MPESA_PAY_TO, sync: false }
      - { key: MPESA_PAY_NAME, sync: false }
      - { key: INTASEND_PUBLISHABLE_KEY, sync: false }     # ISPubKey_... from IntaSend > Settings > API Keys (used with the secret key for the M-Pesa prompt; there is no card payment)
      - { key: INTASEND_SECRET_KEY, sync: false }          # ISSecretKey_... from IntaSend > Settings > API Keys
      - { key: INTASEND_WEBHOOK_CHALLENGE, sync: false }   # same string you type as "Challenge" in the IntaSend webhook
