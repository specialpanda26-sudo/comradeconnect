name: keepalive
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake and check the server
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://comradeconnectback.onrender.com/healthz
      - name: Run background jobs
        run: |
          curl -fsS --max-time 90 -X POST -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" https://comradeconnectback.onrender.com/internal/cron
