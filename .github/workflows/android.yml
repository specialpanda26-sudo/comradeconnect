name: Build Android APK

# Runs by itself every time you push a change to the website or the app files,
# and you can still run it by hand: GitHub > Actions > Build Android APK > Run workflow.
# The finished app appears under Releases, and the website's Download button always gives the newest one.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'android-wrapper/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-wrapper
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PUB_REPO: ${{ vars.RELEASES_REPO }}
      PUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build number (minutes since 2023-11-14, so every build is higher than the one before, even after a repo reset)
        working-directory: .
        run: echo "BUILD_N=$(( ($(date +%s) - 1700000000) / 60 + 1000 ))" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check signing secrets are all set or all empty
        working-directory: .
        run: |
          n=0; for v in "$KS_B64" "$KS_PASS" "$KS_ALIAS" "$KEY_PASS"; do [ -n "$v" ] && n=$((n+1)); done
          if [ "$n" -ne 0 ] && [ "$n" -ne 4 ]; then echo "Only $n of the 4 signing secrets are set. Set all 4 (see android-wrapper/README.md) or remove them."; exit 1; fi

      - name: Pack the website into the app
        run: VERSION_NAME=1.0.${{ env.BUILD_N }} python3 bundle.py

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create the Android project
        run: npx cap add android

      - name: Permissions, version, icons
        run: |
          pip install --quiet pillow
          VERSION_CODE=${{ env.BUILD_N }} VERSION_NAME=1.0.${{ env.BUILD_N }} python3 prepare.py

      - name: Build and sign
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" --out ../comrade-connect.apk "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify ../comrade-connect.apk
            echo "Signed with your own key. New versions install over old ones." >> "$GITHUB_STEP_SUMMARY"
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../comrade-connect.apk
            echo "WARNING: no signing key set, so this APK uses a temporary key. It installs fine, but you must uninstall the old app before installing the next build. See android-wrapper/README.md to set up a permanent key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the APK (package, version, signature)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging comrade-connect.apk | grep -E "^package:|sdkVersion|targetSdkVersion" | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs comrade-connect.apk | grep -E "SHA-256|SHA-1|Verified" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(stat -c%s comrade-connect.apk)" -gt 1000000 || { echo "APK is too small, something went wrong"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: comrade-connect-apk
          path: android-wrapper/comrade-connect.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ env.BUILD_N }}
          name: Comrade Connect app ${{ env.BUILD_N }}
          body: "Install comrade-connect.apk on your Android phone. ${{ github.event.head_commit.message }}"
          make_latest: true
          files: android-wrapper/comrade-connect.apk

      # Optional copy to a PUBLIC releases repo (needed when this repo is private: visitors without GitHub get a 404 otherwise).
      # Turn on by adding repo variable RELEASES_REPO (e.g. specialpanda26-sudo/comradeconnect-releases) and secret RELEASES_TOKEN.
      - uses: softprops/action-gh-release@v2
        if: ${{ env.PUB_REPO != '' && env.PUB_TOKEN != '' }}
        with:
          repository: ${{ env.PUB_REPO }}
          token: ${{ env.PUB_TOKEN }}
          tag_name: app-${{ env.BUILD_N }}
          name: Comrade Connect app ${{ env.BUILD_N }}
          body: "Install comrade-connect.apk on your Android phone."
          make_latest: true
          files: android-wrapper/comrade-connect.apk
