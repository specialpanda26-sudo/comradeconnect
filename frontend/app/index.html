    catch(e){$('#mpe',sh).textContent=e.message;busy=false}}})})}

var WHY={cancelled:'You cancelled the M-Pesa prompt. Nothing was charged.',insufficient:'Your M-Pesa balance was too low. Top up M-Pesa and try again. Nothing was charged.',wrong_pin:'The M-Pesa PIN was wrong. Try again. Nothing was charged.',timeout:'The prompt timed out or your phone could not be reached. Try again.',expired:'The prompt expired. Try again.',busy:'M-Pesa is busy. Wait a minute and try again.'};
function pend(m){var e=new Error(m);e.pending=true;return e}
async function waitPaid(id){
 var st=null,asked=false;
 for(var i=0;i<80;i++){
  if(i)await sleep(3000);
  try{st=await jget('/api/pay/status?id='+encodeURIComponent(id))}catch(e){continue}
  if(st.manual&&!asked){asked=true;await askCode(id,st.manual);i=-1;continue}
  if(st.status==='submitted')throw pend('Code received. We are checking your payment. It shows up once confirmed, usually within a few minutes.');
  if(st.status!=='pending')break}
 if(!st||st.status==='pending')throw pend('We have not had the M-Pesa confirmation yet. If you paid, it shows up as soon as it is confirmed. Keep the M-Pesa message.');
 if(st.status==='underpaid')throw new Error('The amount paid was less than required. Keep your M-Pesa message and contact support.');
 if(st.status!=='paid')throw new Error(WHY[st.reason]||'Payment was cancelled or failed. If you did pay, keep your M-Pesa message and contact support.');
 return st}

CC.pay=async function(o){
 if(!signedIn()){need();throw new Error('Sign up first.')}
 var c=CUR;if(!c)throw new Error('Paying for this is not connected yet');
 var wallet=o.via==='Wallet',card=o.via==='Card',phone=String(o.phone||'').replace(/\s/g,'');
 if(!wallet&&!card&&!/^(07|01)\d{8}$/.test(phone))throw new Error('Enter a Safaricom or Airtel number like 0712345678.');
 var method=card?'card':undefined,d;
 try{
  if(c.purpose==='order'){
   d=await jpost('/api/market/buy',{listing_id:c.listing_id,phone:phone,use_points:!!o.usePoints,method:method,pay_with:wallet?'wallet':undefined})}
  else if(c.purpose==='wholesale'){
   d=await jpost('/api/wholesale/join',{phone:phone,method:wallet?'wallet':method})}
  else{
   if(wallet)throw new Error('Wallet payment is not available for this. Use M-Pesa or card.');
   var b={purpose:c.purpose,phone:phone,method:method};
   if(c.purpose==='boost'){b.ref_id=c.ref_id;b.plan=c.plan}
   if(c.purpose==='spillfee')b.ref_id=c.ref_id;
   if(c.purpose==='topup')b.amount=o.amount;
   d=await jpost('/api/pay',b)}
  if(!(d.paid==='wallet'||d.active)){
   if(!d.id)throw new Error('Could not start the payment. Try again.');
   if(d.url){try{window.open(d.url,'_blank')}catch(e){}toast('Finish on the card page, then come back here.')}
   await waitPaid(d.id)}
 }catch(e){
  if(e.pending){closeSheet();toast(e.message);setTimeout(function(){loadOrders();CCMETA().then(refresh)},8000)}
  throw e}
 CCMETA().then(refresh);
 return d};

async function jget(path){

 var d=await r.json().catch(function(){return{}});
 if(!r.ok){var er=new Error(ccErr(r.status,d.error));er.status=r.status;er.data=d;throw er}
 return d}
async function jpost(path,body){
 var r;try{r=await fetch(CC_API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})}
 catch(e){throw new Error('Could not reach the server. Check your internet and try again.')}
 var d=await r.json().catch(function(){return{}});
 if(!r.ok){var er=new Error(ccErr(r.status,d.error));er.status=r.status;er.data=d;throw er}
 return d}
function dt(s){var d=new Date(s);if(isNaN(d))return'';
 return d.toLocaleDateString('en-KE',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'})}

/* ---- rules from the server (min, max, fee) ---- */
var RULES={withdraw_min:100,withdraw_max:150000,withdraw_fee_percent:0,withdraw_fee_flat:0};
var WD=[];
function fee(a){return Math.ceil(a*(RULES.withdraw_fee_percent||0)/100-1e-9)+(RULES.withdraw_fee_flat||0)}   /* same rule as the server */
function rulesText(){
 var t='Available '+kes(S.wallet)+'. Smallest withdrawal '+kes(RULES.withdraw_min)+', largest '+kes(RULES.withdraw_max)+'.';
 if(RULES.withdraw_fee_percent||RULES.withdraw_fee_flat)t+=' Fee: '+(RULES.withdraw_fee_percent?RULES.withdraw_fee_percent+'%':'')+(RULES.withdraw_fee_percent&&RULES.withdraw_fee_flat?' + ':'')+(RULES.withdraw_fee_flat?kes(RULES.withdraw_fee_flat):'')+', shown before you confirm.';
 else t+=' A small fee may apply. It is shown before you confirm.';
 return t}

/* ---- the "Recent" rows on Me: withdrawals + ledger ---- */
var WST={requested:'Waiting for admin',sending:'Sending to M-Pesa',paid:'Paid',rejected:'Rejected, money returned'};
var KIND={sale:'Sale',referral:'Referral reward',refund:'Refund',adjustment:'Adjustment',topup:'Deposit by M-Pesa',purchase:'Purchase',gift:'Gift received',reward:'Reward',wholesale_fee:'Wholesaler membership'};
function buildAct(d){
 var rows=[];
 (d.withdrawals||[]).forEach(function(x){
  if(x.status==='rejected')return;                                /* announced once (toast), never listed */
  var sub=(WST[x.status]||esc(x.status))+(x.fee?' · fee '+kes(x.fee)+', you get '+kes(x.net):'')+(x.status==='paid'&&x.payout_ref?' · ref '+esc(x.payout_ref):'')+' · '+dt(x.created_at);
  if(x.status==='requested')sub+=' <button class="badge" data-act="wcancel" data-arg="'+esc(x.id)+'">Cancel</button>';
  rows.push({t:Date.parse(x.created_at)||0,a:['Withdrawal '+kes(x.amount),sub]})});
 (d.ledger||[]).forEach(function(x){
  if(x.kind==='withdrawal'||x.status==='void')return;            /* the withdrawal itself is listed above */
  var lab=esc(x.note||KIND[x.kind]||x.kind);
  rows.push({t:Date.parse(x.created_at)||0,a:[(x.delta>0?'+ ':'- ')+kes(Math.abs(x.delta))+' · '+lab,(x.status==='pending'?'Pending · ':'')+dt(x.created_at)]})});
 rows.sort(function(a,b){return b.t-a.t});
 ACT.length=0;rows.slice(0,10).forEach(function(r){ACT.push(r.a)})}
/* tell the seller once when a withdrawal is paid or rejected (the same idea as the old app) */
function announce(list){
 try{
  var raw=localStorage.getItem('cc_wd_seen'),first=raw===null,seen=raw?JSON.parse(raw):[];
  var done=list.filter(function(x){return x.status==='paid'||x.status==='rejected'});
  done.forEach(function(x){
   if(seen.indexOf(x.id)>-1)return;seen.push(x.id);
   if(!first)toast(x.status==='paid'?'Withdrawal paid: '+kes(x.net||x.amount)+' sent to your M-Pesa.':'Withdrawal not sent. The money is back in your wallet.')});
  localStorage.setItem('cc_wd_seen',JSON.stringify(seen.slice(-50)))
 }catch(e){}}
function applyWallet(d){
 if(typeof d.balance==='number')S.wallet=d.balance;
 if(d.rules)RULES=Object.assign(RULES,d.rules);
 WD=d.withdrawals||[];
 buildAct(d);announce(WD)}
async function loadWallet(quiet){

/* ---- withdraw ---- */
A.withdraw=function(){

 openSheet('Withdraw',
  '<div id="wbody"><div class="card" style="background:var(--tint)"><b>Needs a verified ID</b><p class="sub1" style="margin-top:4px">Status: '+(S.verified?'Verified':'Not verified yet')+'. <span id="wi">'+rulesText()+'</span></p></div>'
  +field('M-Pesa number','<input class="in" id="wp" inputmode="tel" placeholder="07__ ___ ___" autocomplete="tel">')

  +'<p class="note" id="wf" style="min-height:20px"></p><button class="btn k" id="wg">Request withdrawal</button><p class="note">You can cancel while the request is still waiting. Money returns to your wallet.</p></div>',
  function(sh){
   var armed='',go=$('#wg',sh),wf=$('#wf',sh);
   var amt=function(){return Math.floor(+$('#wa',sh).value)};
   var phone=function(){return $('#wp',sh).value.replace(/\s/g,'')};
   function disarm(){armed='';go.textContent='Request withdrawal';var a=amt();

/* follow a "sending" withdrawal until it is paid or rejected (about 2 minutes), like the old app */
async function track(id){
 for(var i=0;i<40;i++){
  await sleep(3000);
  var d;try{d=await jget('/api/wallet')}catch(e){continue}
  applyWallet(d);refresh();
  var w=(d.withdrawals||[]).find(function(x){return x.id===id});if(!w)continue;
  var st=$('#wst');
  if(w.status==='paid'){if(st)st.textContent='Money sent to your M-Pesa'+(w.payout_ref?'. Ref '+w.payout_ref:'')+'.';return}
  if(w.status==='rejected'){if(st)st.textContent='The payout could not be sent. The money is back in your wallet.';return}
  if(w.status==='requested'){if(st)st.textContent='Waiting for an admin to send it. You can cancel until then.';return}}}

/* ---- wallet activity chart (received vs spent) ---- */
var DAY=864e5;
function series(ledger,days){
 var rec=[],spt=[],i,end=new Date();end.setHours(23,59,59,999);var e=end.getTime();
 for(i=0;i<days;i++){rec.push(0);spt.push(0)}
 ledger.forEach(function(x){
  if(x.kind==='withdrawal')return;                                 /* cash-out is not spending */
  if(x.kind==='adjustment'&&/money returned/i.test(x.note||''))return;   /* a cancelled / failed withdrawal coming back */
  var t=Date.parse(x.created_at);if(!t)return;
  var k=days-1-Math.floor((e-t)/DAY);if(k<0||k>=days)return;
  if(x.delta>0)rec[k]+=x.delta;else spt[k]+=-x.delta});
 return{rec:rec,spt:spt}}
function poly(a,mx){var n=a.length;return a.map(function(v,i){return(8+i*(304/Math.max(1,n-1))).toFixed(1)+','+(110-(mx?v/mx*100:0)).toFixed(1)}).join(' ')}
A.wchart=async function(){
 if(!signedIn())return need();
 var LED=null,RNG=30;
 openSheet('Wallet activity','<div class="seg"><button class="on" id="wr30">30 days</button><button id="wr7">7 days</button></div><div id="wch"><p class="note">Loading...</p></div>',function(sh){
  function draw(){
   var box=$('#wch',sh);if(!box)return;
   if(!LED){box.innerHTML='<p class="note">Loading...</p>';return}
   var s=series(LED,RNG),mx=Math.max.apply(null,s.rec.concat(s.spt)),sum=function(a){return a.reduce(function(p,c){return p+c},0)};
   box.innerHTML='<svg viewBox="0 0 320 120" style="width:100%;height:150px"><polyline points="'+poly(s.rec,mx)+'" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round"/><polyline points="'+poly(s.spt,mx)+'" fill="none" stroke="#c4727a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/></svg><div style="display:flex;gap:16px;font-size:12px;font-weight:700;margin:6px 0 12px"><span style="color:#d9741e">● Received</span><span style="color:#c4727a">● Spent</span></div>'
    +(mx?'<p class="note">Last '+RNG+' days: received '+kes(sum(s.rec))+', spent '+kes(sum(s.spt))+'. Balance '+kes(S.wallet)+'.</p>':'<p class="note">No wallet activity yet.</p>')}
  function seg(n){RNG=n;$('#wr30',sh).classList.toggle('on',n===30);$('#wr7',sh).classList.toggle('on',n===7);draw()}
  $('#wr30',sh).onclick=function(){seg(30)};$('#wr7',sh).onclick=function(){seg(7)};
  jget('/api/wallet/stats').then(function(d){LED=d.ledger||[];if(typeof d.balance==='number')S.wallet=d.balance;draw()},
   function(e){var b=$('#wch',sh);if(b)b.innerHTML='<p class="note">'+esc(e.message)+'</p>'})})};
})();

 services:{path:'services',rt:'service',map:function(x){return{uid:x.id,tag:x.category||'General',t:x.title,m:(x.details||'')+(x.price_note?' · '+x.price_note:''),k:x.category||'General',s:0,mine:x.mine,works:x.works||[]}}},

  h.style.transition = 'opacity .5s'; h.style.opacity = '0';
  setTimeout(function () { if (h.parentNode) h.parentNode.removeChild(h); }, 600);
  try { if (window.ccCkShow) setTimeout(window.ccCkShow, 400); } catch (e) {}
}

function build(state, mode) {
  if (host) return;
  host = document.createElement('div'); host.id = 'ccgate'; host.setAttribute('role', 'dialog'); host.setAttribute('aria-label', 'Welcome to Comrade Connect');
  root = host.attachShadow({ mode: 'open' });
  root.innerHTML = '<style>' + CSS + '</style>' + HTML;
  document.body.appendChild(host);
  app = root.getElementById('app'); gDone = false;
  window.ccFirstRunOpen = true;
  wire();
  if (state === 's') {
    spl = true; go('w'); app.className = 'app s'; app.style.setProperty('--b', '.9s');
    tm = setTimeout(function () {
      var next = function () { if (!host || !spl) return; spl = false; if (wantW) toWelcome(); else finish(); };
      if (document.readyState === 'complete') next(); else { window.addEventListener('load', next, { once: true }); setTimeout(next, 6000); }
    }, 6300);
  } else if (state === 'w') { go('w'); app.className = 'app w'; app.style.setProperty('--b', '0s'); }
  else { go('w'); app.className = 'app w'; app.style.setProperty('--b', '0s'); requestAnimationFrame(function () { requestAnimationFrame(function () { go(mode || 'l'); }); }); }
}
function toWelcome() {
  if (!host || !/\bs\b/.test(app.className)) return;
  gset(0); app.className = 'app w'; app.style.setProperty('--b', '.9s');
  setTimeout(function () { if (app) app.style.setProperty('--b', '0s'); }, 2200);
}

/* ---- screens ---- */
function go(k) {
  all('.pane').forEach(function (p) { p.classList.remove('on'); });
  $(k === 'u' ? '#pu' : k === 'l' ? '#pl' : '#pw').classList.add('on');
  $('#bs').textContent = k === 'u' ? 'Create your account to get started.' : 'Welcome back! Log in to continue.';
  app.className = 'app ' + (k === 'w' ? 'w' : 'a' + (k === 'u' ? ' su' : ''));
  if (k !== 'w') mountG();
}
var gi = 0, GL = ['Show me around', 'Next', 'Get started'];
function gset(i) {
  gi = Math.max(0, Math.min(2, i));
  $('#gk').style.transform = 'translateX(' + (-gi * 100) + '%)';
  all('.gsl').forEach(function (s, k) { s.classList.toggle('on', k === gi); });
  all('#gd b').forEach(function (d, k) { d.classList.toggle('on', k === gi); });
  $('#gn').textContent = GL[gi];
}
function sweep(cb) {
  var cv = $('#cover'), p = $('#cp'), d = 24, dur = matchMedia('(prefers-reduced-motion:reduce)').matches ? 10 : 1500, st = null;
  function draw(e) { var y = -.75 * d + e * (100 + .75 * d); p.setAttribute('d', 'M0 0H100V' + y + 'C75 ' + (y + d) + ' 25 ' + (y + d) + ' 0 ' + y + 'Z'); }
  cv.style.transition = 'none'; cv.style.opacity = '1'; cv.style.display = 'block'; draw(0);
  function f(ts) { if (!st) st = ts; var k = Math.min(1, (ts - st) / dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; draw(e); if (k < 1) requestAnimationFrame(f); else setTimeout(function () { cb && cb(); }, 120); }
  requestAnimationFrame(f);
}
function mountG() {
  if (gDone) return; var n = 0;
  (function tryIt() {
    if (!host) return;
    if (!window.ccGoogle) { if (n++ < 20) setTimeout(tryIt, 250); else hideG(); return; }
    gDone = true;
    if (!ccGoogle.on()) return hideG();
    all('.gbx').forEach(function (b) {
      try {
        ccGoogle.mount(b, function () { sweep(function () { finish(); }); },
          function (t) { var e = $('.pane.on .err'); if (e) e.textContent = t || 'Google sign-in failed. Try again.'; },
          { theme: 'outline', type: 'icon', shape: 'circle', size: 'large' });
      } catch (e) {}
    });
  })();
}
function hideG() { all('[data-or],.socs').forEach(function (e) { e.style.display = 'none'; }); }

function wire() {
  var C = cfg(), lines = String(C.landing_captions || '').split('\n').map(function (l) { var p = l.split('|'); return [p[0].trim(), (p[1] || '').trim()]; }).filter(function (p) { return p[0]; });
  all('.gsl').forEach(function (s, k) { if (lines[k]) { s.querySelector('h2').textContent = lines[k][0]; if (lines[k][1]) s.querySelector('p').textContent = lines[k][1]; } });
  all('[data-go]').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.go); }); });
  all('[data-eye]').forEach(function (b) { b.onclick = function () { var i = root.getElementById(b.dataset.eye), h = i.type === 'password'; i.type = h ? 'text' : 'password'; b.classList.toggle('on', h); b.setAttribute('aria-label', h ? 'Hide password' : 'Show password'); }; });
  var ib = $('#invb'); if (ib) ib.onclick = function () { var f = $('#inv'), o = f.classList.toggle('open'); ib.setAttribute('aria-expanded', o); if (o) setTimeout(function () { var s = $('#sr'); s && s.focus(); }, 380); };
  all('[data-skip]').forEach(function (b) { b.onclick = finish; });
  all('[data-t]').forEach(function (u) { u.onclick = function () { var p = u.dataset.t; if (window.ccApp && ccApp.open) ccApp.open(location.origin + p); else window.open(p, '_blank'); }; });
  all('[data-fg]').forEach(function (b) { b.onclick = function () { if (window.CC && CC.forgot) CC.forgot($('#le').value.trim()); }; });
  var wait = function (m) { m.textContent = 'The app is still starting. Try again in a second.'; };
  $('#pl').onsubmit = function (e) {
    e.preventDefault(); var m = $('#e1'), u = $('#le').value.trim(), p = $('#lp').value, b = this.querySelector('.btn');
    if (!u) return m.textContent = 'Enter your username.'; if (!p) return m.textContent = 'Enter your password.';
    if (!window.CC || !CC.restoreAccount) return wait(m); m.textContent = ''; b.classList.add('ld');
    CC.restoreAccount(u, p).then(function () { try { if (window.ccRemember) ccRemember(u, p); } catch (x) {} sweep(function () { finish(); }); },
      function (er) { b.classList.remove('ld'); m.textContent = (er && er.message) || 'That username or password is not right.'; });
  };
  (function fillRef(n) {                      // invite link ?ref=CODE fills the box by itself; typing a code saves it too (works for Google sign-up as well)
    var i = $('#sr'); if (!i) return;
    if (window.ccGetRef) { if (!i.value) i.value = ccGetRef() || ''; i.oninput = function () { i.value = i.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (window.ccSetRef) ccSetRef(i.value); }; }
    else if (n < 20) setTimeout(function () { fillRef(n + 1); }, 250);
  })(0);
  $('#pu').onsubmit = function (e) {
    e.preventDefault(); var m = $('#e2'), u = $('#se').value.trim(), p = $('#sp').value, b = this.querySelector('.btn');
    if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return m.textContent = 'Username: 3 to 20 letters, numbers or _';
    if (p.length < 8) return m.textContent = 'Use at least 8 characters.';
    if (p.toLowerCase() === u.toLowerCase()) return m.textContent = 'The password cannot be your username.';
    if (p !== $('#sc').value) return m.textContent = 'The passwords do not match.';
    if (window.ccSetRef && !ccSetRef(($('#sr') || {}).value)) return m.textContent = 'That invite code does not look right. Leave it empty to skip.';
    if (!window.CC || !CC.createAccount) return wait(m); m.textContent = ''; b.classList.add('ld');
    var r; try { r = CC.createAccount('password', { handle: u, password: p }); } catch (x) { b.classList.remove('ld'); return m.textContent = x.message || 'Could not create the account.'; }
    r.then(function () { sweep(finish); }, function (er) { b.classList.remove('ld'); m.textContent = (er && er.message) || 'Could not create the account. Try again.'; });
  };
  all('input').forEach(function (i, k) {
    i.addEventListener('focus', function () { app.classList.add('typ', 'q'); });
    i.addEventListener('blur', function () { setTimeout(function () { if (!root) return; var a = root.activeElement; if (!a || a.tagName !== 'INPUT') app.classList.remove('typ'); }, 120); });
    tw(i, k);
  });
  var gk = null;
  all('#gd b').forEach(function (d, k) { d.onclick = function () { gset(k); }; });
  $('#gn').onclick = function () { gi < 2 ? gset(gi + 1) : go('u'); };
  $('#gs .gl').src = $('.brand img').src;
  var gs = $('#gs'); gs.addEventListener('pointerdown', function (e) { gk = e.clientX; });
  gs.addEventListener('pointerup', function (e) { if (gk === null) return; var dx = e.clientX - gk; gk = null; if (Math.abs(dx) > 40) gset(gi + (dx < 0 ? 1 : -1)); });
  gset(0);
}
/* typing hint inside the empty fields */
function tw(i, k) {
  var full = i.placeholder, n = 0, d = 1;
  function s() {
    if (!host || !i.isConnected) return; var t = 70;
    if (root.activeElement === i || i.value) { i.placeholder = full; n = full.length; d = -1; return setTimeout(s, 500); }
    n += d; i.placeholder = full.slice(0, n) + '|';
    if (d > 0 && n >= full.length) { i.placeholder = full; d = -1; t = 2200; } else if (d < 0 && n <= 0) { d = 1; t = 450; } else if (d < 0) t = 35;
    setTimeout(s, t);
  }
  setTimeout(s, 3500 + k * 600);
}

/* ---- the doors ---- */
function welcome() { wantW = true; if (!host) build('w'); else if (!spl) toWelcome(); }      // while the splash plays it only remembers; the splash end opens the cards
function openAuth(mode) {
  var k = mode === 'create' || mode === 'u' ? 'u' : 'l';
  if (!host) return build('a', k);
  clearTimeout(tm); spl = false; if (/\bs\b/.test(app.className)) { app.className = 'app w'; app.style.setProperty('--b', '0s'); }
  go(k);
}
window.ccGate = { welcome: welcome, open: openAuth, close: finish };
window.ccAuthPanel = openAuth;

/* the splash plays once per visit (reloads skip it, like the old loading screen) */
if(!/#app/.test(location.hash)){build('s');welcome();}
})();
</script>
<script>/* Section 2: site-editor banner, countdown chips, hostel vacancy count. */
(function(){
'use strict';
var KEY='cc_banner_x';
function api(){return typeof CC_API==='string'?CC_API:''}
function get(p){return fetch(api()+p).then(function(r){return r.ok?r.json():null}).catch(function(){return null})}
function dismissed(t){try{return (localStorage.getItem(KEY)||'').trim()===String(t).trim()}catch(e){return false}}

async function load(){
 if(!api())return;
 var changed=false;
 var sc=await get('/api/site-content'),c=sc&&sc.content;
 if(c){
  var bt=(c.banner_on==='1'&&c.banner_text)?String(c.banner_text):'';
  var nb=(bt&&!dismissed(bt))?bt:'';
  if(S.banner!==nb){S.banner=nb;changed=true}
  var ch=[c.chip_1,c.chip_2,c.chip_3].filter(function(x){return x&&String(x).trim()}).map(String);
  if(JSON.stringify(ch)!==JSON.stringify(S.chips||[])){S.chips=ch;changed=true}
 }
 var h=await get('/api/c/hostels?limit=100'),n=0;
 if(h&&Array.isArray(h.items)){
  h.items.forEach(function(x){if(x&&x.kind==='vacancy'&&x.vacancies>0)n+=Number(x.vacancies)||0});
  if(S.vac!==n){S.vac=n;changed=true}
  if(typeof XT!=='undefined'&&XT[0]&&XT[0][0]==='hostels'){var lab=n>0?n+(n===1?' vacancy':' vacancies'):'Vacant rooms';if(XT[0][3]!==lab){XT[0][3]=lab;changed=true}}
 }
 if(changed&&!S.stack.length&&(S.tab==='home'||S.tab==='explore')){try{refresh()}catch(e){}}
}
load();
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
})();
</script>
