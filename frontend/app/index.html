<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comrade Connect</title>
<meta name="description" content="Comrade Connect: the anonymous campus feed, safe marketplace and community for Kenyan comrades.">
<meta name="theme-color" content="#fbf1ed">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>[hidden]:not([hidden=until-found i]){display:none!important}img{max-width:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}</style>
<style>
:root{
  --ink:#16130f;--mut:#6a625a;--bg:#fbf1ed;--bg2:#f3efe9;--card:rgba(255,255,255,.86);--line:rgba(22,19,15,.09);
  --o:#ff8a3d;--o2:#e8744f;--rose:#c4727a;--sage:#a9b8a2;--peach:#ffd9b8;--ok:#1f9d57;--bad:#c2410c;
  --sh:0 10px 28px rgba(140,80,50,.11);--tint:rgba(255,138,61,.13);--inv:#fff;
  --page:linear-gradient(165deg,#4fa6e6 0%,#8ec7f2 55%,#d6ebfa 100%);
}
:root[data-theme="dark"]{
  --ink:#f6efe9;--mut:#b6aca2;--bg:#17130f;--bg2:#100d0a;--card:rgba(44,37,32,.86);--line:rgba(255,255,255,.1);
  --sh:0 10px 28px rgba(0,0,0,.35);--tint:rgba(255,138,61,.18);--inv:#17130f;--page:linear-gradient(165deg,#10243a,#18324d 60%,#223d56);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#f6efe9;--mut:#b6aca2;--bg:#17130f;--bg2:#100d0a;--card:rgba(44,37,32,.86);--line:rgba(255,255,255,.1);
    --sh:0 10px 28px rgba(0,0,0,.35);--tint:rgba(255,138,61,.18);--inv:#17130f;--page:linear-gradient(165deg,#10243a,#18324d 60%,#223d56);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--page) fixed;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;border:0;background:none;outline:none}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}.i.l{width:28px;height:28px}

/* app shell */
.stage{min-height:100dvh;display:flex;justify-content:center;padding:0}
.phone{position:relative;width:100%;max-width:430px;height:100dvh;background:linear-gradient(180deg,var(--bg),var(--bg2));overflow:hidden;isolation:isolate}
@media(min-width:700px){.phone{box-shadow:0 0 80px rgba(8,40,80,.28)}}
body.desk .stage{padding:0}
body.desk .phone{max-width:none;height:100dvh;border:0;border-radius:0;box-shadow:none}
body.desk .view,body.desk .subv{padding-left:max(24px,calc((100% - 1040px)/2));padding-right:max(24px,calc((100% - 1040px)/2))}
body.desk .tiles{grid-template-columns:repeat(4,1fr)}
body.desk .pgrid,body.desk .fgrid{grid-template-columns:repeat(3,1fr)}
body.desk .sheet{max-width:560px;left:50%;transform:translate(-50%,110%)}
body.desk .sheet.on{transform:translate(-50%,0)}

/* views */
.view,.subv{position:absolute;inset:0;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) 20px 150px;overscroll-behavior:contain}
.view{display:none}.view.on{display:block;animation:fi .28s ease}
.subv{z-index:15;background:linear-gradient(180deg,var(--bg),var(--bg2))}
.subv[hidden]{display:none}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:6px 0 18px}
.hd h1{font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hd .sb{font-size:13px;color:var(--mut);margin-top:3px;max-width:290px}
.hd .lt{display:flex;gap:12px;align-items:center}
.hd .rt{display:flex;gap:8px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec a,.sec button.lk{font-size:13px;font-weight:700;color:var(--ink);text-decoration:none;cursor:pointer}
.sub1{font-size:13px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}

/* buttons */
.rb{width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;flex:none;position:relative}
.rb.dk{background:var(--ink);color:var(--inv)}
.rb.sm{width:38px;height:38px}
.rb .dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--o);border:2px solid var(--card)}
.btn{height:54px;border-radius:999px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 22px;width:100%;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.k{background:var(--ink);color:var(--inv)}
.btn.w{background:var(--card);box-shadow:var(--sh)}
.btn.o{background:linear-gradient(135deg,#ffa05a,#ee7a4f);color:#1d0f06}
.btn.sm{height:42px;font-size:13px;padding:0 16px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stk{display:grid;gap:10px}
.lnk{font-weight:800;font-size:13px;text-decoration:underline;text-underline-offset:4px;padding:10px 0}
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:11px 18px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip.on{background:var(--ink);color:var(--inv)}
.chip.sm{padding:8px 14px;font-size:12px}
.seg{display:flex;background:var(--card);border-radius:999px;padding:5px;box-shadow:var(--sh);margin-bottom:16px}
.seg button{flex:1;height:42px;border-radius:999px;font-weight:800;font-size:13px}
.seg button.on{background:var(--ink);color:var(--inv)}

/* gradient blobs */
.gb{position:relative;overflow:hidden;isolation:isolate;background:#fff8f4}
:root[data-theme="dark"] .gb{background:#2a211b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .gb{background:#2a211b}}
.gb::before{content:"";position:absolute;inset:-25%;z-index:-1;filter:blur(30px);background:var(--bl);opacity:.95}
.b1{--bl:radial-gradient(42% 52% at 24% 38%,#ff8a3d 0,transparent 72%),radial-gradient(44% 52% at 80% 60%,#c4727a 0,transparent 72%),radial-gradient(40% 40% at 45% 95%,#ffd9b8 0,transparent 72%)}
.b2{--bl:radial-gradient(45% 50% at 20% 30%,#a9b8a2 0,transparent 72%),radial-gradient(45% 50% at 80% 75%,#c4727a 0,transparent 72%),radial-gradient(40% 40% at 70% 15%,#ffd9b8 0,transparent 72%)}
.b3{--bl:radial-gradient(45% 55% at 25% 70%,#c4727a 0,transparent 72%),radial-gradient(50% 50% at 78% 35%,#ff8a3d 0,transparent 72%),radial-gradient(40% 40% at 50% 5%,#ffe7d2 0,transparent 72%)}
.b4{--bl:radial-gradient(48% 50% at 75% 25%,#ffd9b8 0,transparent 72%),radial-gradient(48% 50% at 30% 80%,#ff8a3d 0,transparent 72%),radial-gradient(40% 40% at 90% 90%,#a9b8a2 0,transparent 72%)}
.b5{--bl:radial-gradient(45% 55% at 20% 25%,#ff8a3d 0,transparent 72%),radial-gradient(45% 55% at 85% 80%,#a9b8a2 0,transparent 72%),radial-gradient(40% 40% at 60% 40%,#c4727a 0,transparent 72%)}
.on-b{color:#16130f}

/* cards */
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:28px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--card);border-radius:22px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left}
.row .ri{width:42px;height:42px;border-radius:14px;background:var(--tint);display:grid;place-items:center;flex:none}
.row .rx{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:800}
.row small{display:block;font-size:12px;color:var(--mut);margin-top:1px}
.row .rr{font-weight:800;font-size:14px;flex:none}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.tag.o{color:#c2540f}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--tint);font-size:11px;font-weight:800}
.badge.ok{background:rgba(31,157,87,.14);color:var(--ok)}
.empty{padding:36px 10px;text-align:center;color:var(--mut);font-size:14px}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -20px;padding:2px 20px 14px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}

/* home */
.top{display:flex;gap:12px;align-items:center}
.search{flex:1;height:52px;border-radius:999px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;gap:12px;padding:0 20px;color:var(--mut);font-weight:600;cursor:pointer;text-align:left}
.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
/* full legal pages inside the app */
.ldn{margin-bottom:14px;flex-wrap:nowrap;overflow-x:auto}
.ldoc{font-size:14.5px;color:var(--mut);line-height:1.65}
.ldoc p{margin:8px 0}.ldoc b{color:var(--ink)}.ldoc a{color:var(--o2);font-weight:800}
.ldoc section{padding-top:20px;margin-top:20px;border-top:1px solid var(--line)}.ldoc section:first-of-type{border-top:0;margin-top:6px;padding-top:6px}
.ldoc h2{display:flex;gap:10px;align-items:flex-start;font-size:18px;line-height:1.25;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
.ldoc h2 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--o2);font:800 12px/26px Manrope,sans-serif;text-align:center;font-style:normal}
.ldoc h3{font-size:15px;color:var(--ink);margin:14px 0 4px}
.ldoc ul,.ldoc ol{list-style:none;margin:8px 0}.ldoc li{position:relative;padding-left:20px;margin:8px 0}
.ldoc ul>li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--o)}
.ldoc ol{counter-reset:n}.ldoc ol>li{counter-increment:n;padding-left:30px}.ldoc ol>li::before{content:counter(n);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--tint);color:var(--o2);font:800 11.5px/22px Manrope,sans-serif;text-align:center}
.ldoc table{display:block;overflow-x:auto;border-collapse:collapse;margin:10px 0;font-size:13.5px}.ldoc th,.ldoc td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;min-width:96px}.ldoc th{color:var(--ink)}
.ldoc .card{background:var(--card);border-radius:18px;padding:4px 14px;margin:10px 0;box-shadow:none}
.banner{cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:space-between;background:linear-gradient(135deg,#ffa05a,#ee7a4f);color:#1d0f06;border-radius:20px;padding:6px 6px 6px 16px;font-weight:800;font-size:13px;margin-bottom:14px;min-height:50px}.banner span{flex:1;padding:6px 0}.banner .bx{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(29,15,6,.12);color:#1d0f06}.banner .bx:active{transform:scale(.92)}
.hero{border-radius:36px;padding:22px 22px 22px;box-shadow:var(--sh);min-height:372px;display:flex;flex-direction:column;color:#16130f}
.hero .hi{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;margin-bottom:14px}
.hero h1{font-size:46px;letter-spacing:-.045em;line-height:1;font-weight:800}
.hero .gr{font-weight:800;font-size:14px;margin-bottom:8px}
.hero p{font-size:14px;margin-top:8px;max-width:310px;font-weight:600}
.hero .fill{flex:1;min-height:60px}
.hero .btn{margin-top:14px}
.hero .lnk{align-self:center;color:#16130f}
.cds{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.mq{overflow:hidden;white-space:nowrap;margin:18px -20px 0;background:var(--ink);color:var(--inv);padding:11px 0;font-weight:800;font-size:12px;letter-spacing:.12em}
.mq div{display:inline-block;animation:mq 38s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
.stories{display:flex;gap:14px;overflow-x:auto;margin:18px -20px 0;padding:2px 20px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.st{display:grid;justify-items:center;gap:6px;font-size:11px;font-weight:700;flex:none;width:66px}
.st .ring{width:62px;height:62px;border-radius:50%;padding:3px;background:conic-gradient(#ff8a3d,#c4727a,#a9b8a2,#ff8a3d)}
.st .ring i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg);font-style:normal;font-weight:800;font-size:15px}
.st.me .ring{background:var(--line)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border-radius:32px;padding:16px;min-height:172px;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;box-shadow:var(--sh);color:#16130f;width:100%}
.tile .ic{position:absolute;top:14px;left:14px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#16130f}
.tile b{font-size:18px;letter-spacing:-.02em;font-weight:800;display:block}
.tile small{font-size:12px;font-weight:600;opacity:.8;display:block;margin-top:2px}
.hs .tile{width:210px;min-height:210px;flex:none}
.pcard{margin-bottom:14px}
.sow{display:flex;gap:14px;align-items:center}
.sow .ph{width:64px;height:64px;border-radius:22px;flex:none}
.opt{position:relative;height:50px;border-radius:18px;background:rgba(196,114,122,.22);overflow:hidden;display:flex;align-items:center;padding:0 16px;font-weight:800;font-size:14px;margin-bottom:10px;width:100%;text-align:left}
.opt i{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.9;border-radius:18px 0 0 18px;transition:width .5s}
.opt span{position:relative;z-index:1;color:var(--ink);mix-blend-mode:normal;display:flex;justify-content:space-between;width:100%}
.opt.v i+span{color:#fff}
.opt:not(.v) i{width:0!important}
.lb{display:flex;align-items:center;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
.lb:first-of-type{border-top:0}
.lb .n{font-size:26px;font-weight:800;color:var(--o2);width:26px;letter-spacing:-.04em}
.lb .nm{flex:1;font-weight:800;font-size:15px}
.lb .nm small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.lb .sc{font-weight:800;font-size:15px;text-align:right}
.mini{display:flex;gap:4px;margin-top:5px}
.mini i{height:5px;border-radius:3px;background:var(--o);display:block}
.vt{display:flex;gap:6px}
.vt button{padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;background:var(--card)}
.vt button.on{background:var(--ink);color:var(--inv)}
.feed{display:grid;gap:12px}
.fgrid{grid-template-columns:1fr 1fr}
.post{background:var(--card);border-radius:26px;padding:16px 18px;box-shadow:var(--sh);backdrop-filter:blur(14px)}
.post h3{font-size:16px;font-weight:800;letter-spacing:-.01em;margin:6px 0 8px;line-height:1.3}
.post .mt{font-size:12px;color:var(--mut)}
.post .pa{display:flex;gap:6px;margin-top:12px;align-items:center}
.pa button{display:inline-flex;gap:6px;align-items:center;padding:7px 11px;border-radius:999px;background:var(--tint);font-size:12px;font-weight:800}
.pa button.on{background:var(--o);color:#1d0f06}
.pa .sp{flex:1}
.fgrid .post{padding:14px}.fgrid .post h3{font-size:14px}
.cat-Notices{color:#1f7a4a}.cat-HostelTea{color:#c2540f}.cat-Crush{color:#b0476f}.cat-StrikeUpdates{color:#a12d2d}.cat-General{color:var(--mut)}
.vfy{display:inline-flex;vertical-align:-3px;margin-left:4px;color:#2f8cf0}
.vfy .i{width:16px;height:16px}

/* nav */
.nav{position:absolute;left:12px;right:12px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;z-index:20;pointer-events:none}
.nb{pointer-events:auto;height:56px;min-width:56px;border-radius:28px;background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(120,60,40,.18);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;font-size:14px;transition:all .25s;position:relative}
.nb.on{padding:0 20px 0 6px;flex:0 1 auto}
.nb .dc{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff9a55,#d9626b);color:#fff}
.nb:not(.on) .dc{background:none;color:var(--ink);width:auto;height:auto}
.nb .lb2{display:none}
.nb.on .lb2{display:inline}
.nb.on::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink)}
.nb .nd{position:absolute;top:12px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--o);border:2px solid var(--card)}
@media(max-width:380px){.nb{min-width:48px;height:52px}.nb.on{padding-right:14px}}
#tech{position:absolute;right:16px;bottom:88px;z-index:19;width:44px;height:44px}
.hide-tech #tech{display:none}

/* sheet */
.sbg{position:absolute;inset:0;background:rgba(22,19,15,.4);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.sbg.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:34px 34px 0 0;padding:20px 20px 30px;z-index:41;transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.sheet .sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet .sh-h h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 6px 8px}
.in{width:100%;height:54px;border-radius:999px;background:var(--card);box-shadow:var(--sh);padding:0 20px;font-weight:600}
textarea.in{height:120px;border-radius:24px;padding:16px 20px;resize:none;line-height:1.4}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 26px) 24px,calc(100% - 20px) 24px;background-size:6px 6px;background-repeat:no-repeat;background-color:var(--card)}
.in::placeholder{color:var(--mut)}
.cnt{text-align:right;font-size:12px;color:var(--mut);margin:-4px 8px 8px}
.sw{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:16px;background:#d6d0c8;position:relative;flex:none;transition:.2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.sw:checked{background:var(--ink)}
.sw:checked::after{left:25px}
.stars{display:flex;gap:6px}
.stars button{width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-weight:800;font-size:14px}
.stars button.on{background:var(--o);color:#1d0f06}
.rr2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-weight:800;font-size:14px}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--o),var(--rose))}

A.payflow=(amount,label,done,opt={})=>{
 let via='M-Pesa',usePts=false;
 const body=()=>`<div class="card" style="margin-bottom:12px"><div class="eyebrow">${esc(label)}</div><div style="font-size:34px;font-weight:800;letter-spacing:-.04em">${kes(usePts?Math.max(0,amount-CCDISC(amount)):amount)}</div>${opt.escrow?'<p class="note">Held in escrow. The seller is paid after you confirm.</p>':''}</div>
 <div class="seg"><button class="${via==='M-Pesa'?'on':''}" data-v="M-Pesa">M-Pesa</button><button class="${via==='Card'?'on':''}" data-v="Card">Card</button>${S.wholesaler||S.wallet>=amount?`<button class="${via==='Wallet'?'on':''}" data-v="Wallet">Wallet</button>`:''}</div>
 ${via==='M-Pesa'?field('M-Pesa number','<input class="in" id="pn" inputmode="tel" placeholder="07__ ___ ___">'):via==='Card'?'<p class="sub1" style="margin-bottom:12px">Card payments (Visa and Mastercard) run on IntaSend\'s own secure page. Card numbers never reach Comrade Connect.</p>':`<p class="sub1" style="margin-bottom:12px">Pay from your wallet balance: ${kes(S.wallet)}.</p>`}
 ${opt.escrow?`<div class="row" style="margin-bottom:12px"><span class="ri">${ic('gift')}</span><span class="rx"><b>Use points</b><small>${CCDISC(amount)>0?(CCDISC(amount)*CCPERKSH())+' points save KSh '+CCDISC(amount)+' on our fee.':'Points can pay part of our fee.'} You have ${S.points}.</small></span>${sw('up',usePts)}</div>`:''}
 <button class="btn o" id="pgo">${via==='Card'?'Continue to secure card page':'Pay '+kes(usePts?Math.max(0,amount-CCDISC(amount)):amount)}</button><p class="note">Never share your M-Pesa PIN with anyone.</p>`;
 const m=sh=>{$$('.seg button',sh).forEach(b=>b.onclick=()=>{via=b.dataset.v;paint()});const u=$('#up',sh);if(u)u.onchange=()=>{usePts=u.checked&&CCDISC(amount)>0;if(u.checked&&!usePts)toast('You have no points to use on this');paint()};
  $('#pgo',sh).onclick=()=>{
   /* Real pay hook: CC.pay({amount,label,via,phone,usePoints,escrow}) must return a Promise that resolves on confirmed payment. */
   if(!(window.CC&&typeof CC.pay==='function')){toast('Payments are not connected yet');return}
   const btn=$('#pgo',sh);btn.disabled=true;const pay=usePts?Math.max(0,amount-CCDISC(amount)):amount;
   Promise.resolve().then(()=>CC.pay({amount:pay,label,via,phone:(($('#pn',sh)||{}).value||'').trim(),usePoints:usePts,escrow:!!opt.escrow}))
    .then(()=>{if(usePts)CCMETA().then(refresh);receipt(label,pay,via);done&&done()},e=>{btn.disabled=false;toast((e&&e.message)||'Payment failed')})}};
 const paint=()=>{const sh=$('#sheet');const h=sh.querySelector('.sh-h').outerHTML;sh.innerHTML='<div class="grab"></div>'+h+body();m(sh)};
 openSheet('Pay',body(),m);
};
function receipt(item,amount,via){

 const h=`<div class="card" style="text-align:center"><div class="paid">PAID</div><h3>${esc(item)}</h3><div style="font-size:34px;font-weight:800;letter-spacing:-.04em;margin:6px 0">${kes(amount)}</div><div class="sub1">via ${via} · Ref ${ref}</div><div class="bars" style="margin:16px 0 6px"></div><p class="note">Keep this receipt. Disputes are reviewed by an admin.</p></div>`;
 $('#sheet').innerHTML=`<div class="grab"></div><div class="sh-h"><h2>Receipt</h2><button class="rb sm" data-act="closesheet" aria-label="Close">${ic('x','s')}</button></div>${h}<button class="btn k" data-act="closesheet">Done</button>`;
}

R.watch=()=>`${head('Watch','Clips and live from campus')}
<div class="seg"><button class="${S.wTab==='clips'?'on':''}" data-act="wtab" data-arg="clips">Videos</button><button class="${S.wTab==='live'?'on':''}" data-act="wtab" data-arg="live">Live</button></div>
<button class="btn o" id="glb" data-act="golivejump" style="margin-bottom:16px">${ic('video','s')} Go live</button>
${S.wTab==='clips'?`<p class="sub1" style="margin-bottom:12px">Show what is happening on campus. Record on your phone or upload a clip. Please do not film people without their consent.</p>
 ${field('Caption (optional)','<input class="in" id="vcap" maxlength="140" placeholder="Add a caption" aria-label="Clip caption">')}
 <div class="two"><button class="btn k" data-act="vrec">${ic('video','s')} Record</button><button class="btn w" data-act="vup">${ic('download','s')} Upload clip</button></div>
 <div class="pgrid" style="margin-top:16px">${CLIPS.map((c,i)=>`<div class="pc"><div class="im gb ${grads[i%5]}" data-act="cplay" data-arg="${i}" style="display:grid;place-items:center;color:#16130f">${ic('play','l')}</div><div class="bd"><b style="font-size:13px">${esc(c[0])}</b><small>${c[1]} likes · ${c[2]} comments</small><div class="pa"><button data-act="clike" data-arg="${i}">${ic('heart','s')}</button><button data-act="ccmt" data-arg="${i}">${ic('chat','s')}</button></div></div></div>`).join('')}</div>
 ${(window.CCCLIPS&&CCCLIPS.more)?'<button class="btn w" data-act="cmore" style="width:100%;margin-top:12px">Load more</button>':''}${(CLIPS.length||(window.CCCLIPS&&CCCLIPS.loading))?'':'<p class="sub1" style="margin-top:12px">No videos yet. Be the first to post one.</p>'}
 <p class="note">Clips are saved to a video host so everyone can watch. Clip comments are shared and counted.</p>`
:`<p class="sub1" style="margin-bottom:12px">Go live from campus: matches, events, trips, strike updates. Stay safe and respect people's privacy.</p>
 ${LIVES.map((l,i)=>`<button class="card gb ${grads[i+1]}" style="width:100%;text-align:left;color:#16130f" data-act="room" data-arg="${i}"><span class="live-b">LIVE</span> <span class="sub1" style="color:#16130f">${l.v} watching</span><h3 style="margin-top:8px">${esc(l.t)}</h3><div class="sub1" style="color:#16130f">Hosted by ${l.host}</div></button>`).join('')}
 ${LIVES.length?'':'<p class="sub1" style="margin-bottom:12px">Nobody is live right now.</p>'}
 <div class="card"><h3>Go live</h3><p class="sub1" style="margin-bottom:12px">Start your live on YouTube, Facebook, TikTok or Twitch, then paste its link here. Comrades watch it and chat here. Anyone with an account can go live.</p>
 ${field('Title','<input class="in" id="lt" maxlength="80" placeholder="What is happening?">')}${field('Live link','<input class="in" id="lu" inputmode="url" placeholder="https://...">')}<button class="btn o" data-act="golive">Go live</button></div>`}`;
A.wtab=a=>{S.wTab=a;refresh()};
A.golivejump=()=>{if(S.wTab!=='live')A.wtab('live');setTimeout(()=>{const e=$('#lt');if(e){e.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{try{e.focus({preventScroll:true})}catch(x){}},350)}},120)};
A.vrec=()=>toast('Video upload is not connected yet');
A.vup=()=>toast('Video upload is not connected yet');
A.clike=a=>{CLIPS[+a][1]++;refresh()};
A.ccmt=a=>{const c=CLIPS[+a];openSheet('Clip comments',`<div class="chat"></div><form class="cbar" id="rc"><input id="ri" maxlength="200" placeholder="Add a comment"><button aria-label="Send">${ic('send','s')}</button></form>`,sh=>{$('#rc',sh).onsubmit=e=>{e.preventDefault();if(!$('#ri',sh).value.trim())return;c[2]++;closeSheet();refresh();pts(1,'commented')}})};
A.golive=()=>{const t=($('#lt')||{}).value,u=($('#lu')||{}).value;if(!t||!/^https?:\/\//.test(u||''))return toast('Add a title and a valid live link');LIVES.unshift({t,v:1,host:'You',on:1,mine:1});pts(10,'went live');refresh()};
A.room=a=>{const l=LIVES[+a];let hearts=0,react=0,chat=[];
 const draw=()=>{$('#lc').innerHTML=chat.map(c=>`<div class="msg"><b style="font-size:12px;display:block;color:var(--mut)">${esc(c[0])}</b>${esc(c[1])}</div>`).join('');$('#lh').textContent=hearts+' hearts';$('#rs').textContent=react};
 openSheet(null,`<div class="sh-h"><span class="live-b">LIVE</span><span class="sub1">${l.v} watching</span></div><h2 style="font-size:22px;margin-bottom:10px">${esc(l.t)}</h2>
 <div class="stats" style="margin-bottom:12px"><div><b>${l.v}</b><small>Watching</small></div><div><b id="rcn">${chat.length}</b><small>Comments</small></div><div><b id="rs">0</b><small>Reactions</small></div></div>
 <div class="gb b3" style="height:180px;border-radius:26px;display:grid;place-items:center;color:#16130f;text-align:center;position:relative" id="rm"><div>${ic('play','l')}<div class="sub1" style="color:#16130f">Stream plays here (YouTube, Facebook, TikTok or Twitch)</div></div></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><button class="rb" id="lheart" aria-label="Send a heart">${ic('heart')}</button><span class="sub1" id="lh">0 hearts</span></div>
 <div class="chat" id="lc" style="max-height:30vh;overflow:auto"></div>
 <form class="cbar" id="lf"><input id="li" maxlength="140" placeholder="Say something. No phone numbers or links." aria-label="Chat message"><button aria-label="Send">${ic('send','s')}</button></form>
 ${l.mine?`<button class="btn o" style="margin-top:12px" data-act="endlive" data-arg="${a}">End my live</button>`:''}<button class="btn w" style="margin-top:10px" data-act="closesheet">Leave stream</button>`,sh=>{draw();
  $('#lheart',sh).onclick=()=>{hearts++;react++;const f=document.createElement('span');f.className='float';f.style.left=(20+Math.random()*60)+'%';f.innerHTML=ic('heart');f.firstChild.style.fill='currentColor';$('#rm',sh).appendChild(f);setTimeout(()=>f.remove(),1600);draw()};
  $('#lf',sh).onsubmit=e=>{e.preventDefault();const v=$('#li',sh).value.trim();if(!v)return;chat.push(['You',v]);$('#li',sh).value='';$('#rcn').textContent=chat.length;draw();pts(1,'commented')};})};
A.endlive=a=>{LIVES.splice(+a,1);closeSheet();refresh()};

/* ===== KURA ===== */
const KURA=[];
let KT='Compete',KF='Campus';
SUB.kura=()=>{
 const sorted=[...KURA].sort((a,b)=>b[3]-a[3]);
 return `${back('Kura','Inter-campus competition',`<button class="rb" data-act="bell" aria-label="Notifications">${ic('bell')}</button>`)}
 <div class="gb b3" style="border-radius:34px;min-height:200px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:#16130f;box-shadow:var(--sh)"><span></span><div><h2 style="font-size:28px;letter-spacing:-.03em">Mystery prize</h2><div style="font-weight:600;font-size:13px">Set by the admin each round · Campus Star Awards</div></div></div>
 <div class="chips" style="margin-top:14px">${['Compete','Leaderboard','Enter competition'].map(t=>`<button class="chip ${KT===t?'on':''}" data-act="ktab" data-arg="${t}">${t}</button>`).join('')}</div>
 ${KT==='Compete'?`<div class="chips" style="padding-top:0">${['Campus','Category','Place'].map(t=>`<button class="chip sm ${KF===t?'on':''}" data-act="kfil" data-arg="${t}">${t}</button>`).join('')}</div>
  ${sorted.map((k,i)=>`<div class="row"><span class="ri" style="font-weight:800">${i+1}</span><span class="rx"><b>${k[0]}</b><small>${k[1]} · ${k[2]} · ${k[3]} votes</small></span><button class="btn o sm" data-act="kvote" data-arg="${KURA.indexOf(k)}">Vote</button></div>`).join('')||'<div class="empty" style="margin:14px 0">No entries yet.</div>'}
  <div class="two"><button class="btn k" data-act="spill">Drop Tea</button><button class="btn w" data-act="spill">Spill Secret</button></div>`:''}
 ${KT==='Leaderboard'?`<div class="pod">${[1,0,2].filter(i=>sorted[i]).map(i=>`<div class="gb ${grads[i+1]}" style="min-height:${[150,120,100][i]}px"><b>${i+1}</b>${sorted[i][0].split(' ')[0]}<span style="font-size:11px;font-weight:700">${sorted[i][3]}</span></div>`).join('')}</div>${sorted.length?'':'<div class="empty">No entries yet.</div>'}${sorted.slice(3).map((k,i)=>`<div class="row"><span class="ri" style="font-weight:800">${i+4}</span><span class="rx"><b>${k[0]}</b><small>${k[2]}</small></span><span class="rr">${k[3]}</span></div>`).join('')}`:''}
 ${KT==='Enter competition'?`${field('Full name','<input class="in" id="kn" maxlength="40">')}<div class="two">${field('Category',sel('kc',['Campus Star','Best Dressed','Best Voice','Best Athlete']))}${field('Campus',sel('kp',['Kirinyaga','Embu','Mount Kenya']))}</div>${field('Why should comrades vote for you?','<textarea class="in" id="kw" maxlength="200"></textarea>')}${field('Photo',`<button class="btn w" data-act="upl">${ic('plus','s')} Add a photo</button>`)}<button class="btn o" data-act="kenter">Submit entry</button>`:''}`;
};
A.ktab=a=>{KT=a;refresh()};A.kfil=a=>{KF=a;refresh()};
A.kvote=a=>{KURA[+a][3]++;refresh();toast('Vote counted')};
A.kenter=()=>{const n=($('#kn')||{}).value;if(!n)return toast('Add your name');KURA.push([n,$('#kc').value,$('#kp').value,0]);KT='Compete';refresh();toast('Entry submitted for admin review')};
/* ===== ME ===== */
const ACT=[];
const lvl=p=>p<100?['Bronze',100]:p<300?['Silver',300]:p<600?['Gold',600]:['Platinum',1000];
R.me=()=>{
 const [ln,nx]=lvl(S.points),days=S.week||[0,0,0,0,0,0,0];
 return `${head('Me','@'+S.handle,`<button class="rb" data-act="theme" aria-label="Toggle theme">${ic(isDark()?'sun':'moon')}</button><button class="rb" data-act="settings" aria-label="Settings">${ic('gear')}</button>`)}
 <div class="card gb b1" style="color:#16130f;padding:20px"><div style="display:flex;gap:14px;align-items:center"><div style="width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center">${ic('user','l')}</div><div style="flex:1"><b style="font-size:19px">@${esc(S.handle)}${S.verified?vb():''}</b><div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"><span class="badge" style="background:rgba(255,255,255,.75)">Anonymous</span><span class="badge" style="background:rgba(255,255,255,.75)">${ln}</span></div></div><button class="rb sm" data-act="editprof" aria-label="Edit profile">${ic('edit','s')}</button></div>
 <div class="stats" style="margin-top:16px">${[[S.points,'Points'],[S.streak,'Day streak'],[S.referrals||0,'Referrals']].map(([a,b])=>`<div style="background:rgba(255,255,255,.7)"><b>${a}</b><small style="color:#16130f">${b}</small></div>`).join('')}</div></div>
 <button class="wallet gb b3" data-act="wchart" aria-label="Wallet balance, tap for graph"><div class="eyebrow" style="color:#16130f">Wallet balance</div><div class="big">KES ${S.wallet.toLocaleString('en-KE',{minimumFractionDigits:2})}</div></button>
 <div class="two" style="margin:12px 0 14px"><button class="btn k" data-act="deposit">Deposit</button><button class="btn w" data-act="withdraw">Withdraw</button></div>
 <div class="row" style="flex-wrap:wrap"><span class="ri">${ic('zap')}</span><span class="rx"><b>Wholesaler${S.wholesaler?' · active':''}</b><small>KES ${CCWS().fee} to join, renews every ${CCWS().days} days. Upload unlimited photos.</small></span>${S.wholesaler?'<span class="badge ok">Active</span>':'<button class="btn o sm" data-act="wholesale">Join</button>'}</div>
 ${ACT.map(a=>`<div class="row"><span class="ri">${ic('wallet')}</span><span class="rx"><small style="margin:0" class="eyebrow">Recent</small><b>${a[0]}</b><small>${a[1]}</small></span></div>`).join('')}
 <div class="sec"><h2>Shortcuts</h2></div>
 <div class="two">${[['rewards','gift','Rewards','b1'],['club','cart','Club','b2'],['gift','heart','Gift page','b4'],['msgs','chat','Messages','b3']].map(([a,i,t,g])=>`<button class="tile gb ${g}" style="min-height:96px" data-act="${a}"><span class="ic" style="width:38px;height:38px;top:10px;left:12px">${ic(i,'s')}</span><b style="font-size:15px">${t}</b></button>`).join('')}</div>
 <div class="sec"><h2>My dashboard</h2></div>
 <div class="card"><div class="stats">${[[POSTS.filter(p=>p.mine).length,'Stories'],[S.ncmt||0,'Comments'],[S.points,'Points']].map(([a,b])=>`<div><b>${a}</b><small>${b}</small></div>`).join('')}</div><p class="sub1" style="margin:16px 0 0">Points earned, last 7 days</p><div class="wk">${days.map(d=>`<i style="height:${d*7}px"></i>`).join('')}</div><div class="wkl" style="margin-top:6px">${['M','T','W','T','F','S','S'].map(d=>`<span>${d}</span>`).join('')}</div></div>
 <div class="sec"><h2>Account and safety</h2></div>
 ${row('bell','Notifications','Choose what you want to hear about','mesheet','notif')}
 ${row('shield','Safety','Blocked posters, hidden stories, emergency contacts','mesheet','safe')}
 ${row('doc','Documentation','How Comrade Connect works. Download as PDF','mesheet','docs')}
 ${row('mail','Recovery email','Reset your password if you forget it','mesheet','remail')}
 
 ${row('user','Account','Sign-in options, tour, cookies, sign out','mesheet','acct')}
 ${row('lock','Secure my account','Lock with fingerprint or Face ID','mesheet','secure')}
 ${row('vfy','Verification','Get verified, student email (optional)','mesheet','verify')}
 ${row('finger','Passkeys','Sign in with your fingerprint or face','mesheet','pk')}
 ${row('key','Restore an account','Use your account ID and recovery code','mesheet','restore')}
 ${row('robot','Support','Ask AI, help and contact','support')}
 ${footer()}`;
};
A.theme=()=>{const cur=document.documentElement.dataset.theme;const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;ls.set('cc_theme',n);toast(n==='dark'?'Dark mode':'Light mode')};
A.settings=()=>push('settings');A.support=()=>push('support');A.gift=()=>push('gift');
A.msgs=()=>openSheet('Messages',`<p class="sub1" style="margin-bottom:12px">Anonymous threads. Neither of you sees the other's name.</p><p class="note">No messages yet.</p>`);
A.editprof=()=>openSheet('Edit profile',`${field('Username','<input class="in" id="un" value="'+esc(S.handle)+'" maxlength="24">')}${field('Profile picture',`<button class="btn w" data-act="upl">${ic('plus','s')} Choose a picture</button>`)}<button class="btn k" id="ps">Save</button><p class="note">Your handle is never shown on your posts.</p>`,sh=>{$('#ps',sh).onclick=()=>{S.handle=$('#un',sh).value.trim()||S.handle;closeSheet();refresh();toast('Profile saved')}});
A.wholesale=()=>A.payflow(CCWS().fee,'Wholesaler plan, '+CCWS().days+' days',()=>{CCMETA().then(refresh)},{ctx:{purpose:'wholesale'}});
A.deposit=()=>openSheet('Deposit',`<p class="sub1" style="margin-bottom:12px">Add money with M-Pesa or card</p>${field('Amount (KES)','<input class="in" id="da" type="number" inputmode="numeric" placeholder="0">')}<button class="btn k" id="dg">Continue</button>`,sh=>{$('#dg',sh).onclick=()=>{const a=+$('#da',sh).value;if(a<10)return toast('Minimum deposit is KES 10');A.payflow(a,'Wallet deposit',()=>{CCMETA().then(refresh)},{ctx:{purpose:'topup'}})}});
A.withdraw=()=>openSheet('Withdraw',`<div class="card" style="background:var(--tint)"><b>Needs a verified ID</b><p class="sub1" style="margin-top:4px">Status: ${S.verified?'Verified':'Not verified yet'}. Minimum KES 100. A small fee applies, shown before you confirm.</p></div>${field('M-Pesa number','<input class="in" inputmode="tel" placeholder="07__ ___ ___">')}${field('Amount (KES)','<input class="in" id="wa" type="number" inputmode="numeric">')}<button class="btn k" id="wg">Request withdrawal</button><p class="note">You can cancel while the request is still waiting. Money returns to your wallet.</p>`,sh=>{$('#wg',sh).onclick=()=>{const a=+$('#wa',sh).value;if(!S.verified){closeSheet();toast('Verify your ID first');return A.mesheet('verify')}if(a<100)return toast('Minimum is KES 100');if(a>S.wallet)return toast('Not enough in your wallet');S.wallet-=a;closeSheet();refresh();toast('Withdrawal requested')}});
A.wchart=()=>{const pts1=[],pts2=[];const pl=a=>a.map((v,i)=>`${i*44+8},${110-v}`).join(' ');
 openSheet('Wallet activity',`<div class="seg"><button class="on">30 days</button><button>7 days</button></div><svg viewBox="0 0 320 120" style="width:100%;height:150px"><polyline points="${pl(pts1)}" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-linecap="round"/><polyline points="${pl(pts2)}" fill="none" stroke="#c4727a" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/></svg><div style="display:flex;gap:16px;font-size:12px;font-weight:700;margin:6px 0 12px"><span style="color:#d9741e">● Received</span><span style="color:#c4727a">● Spent</span></div><p class="note">No wallet activity yet.</p>`)};

/* me sheets */
const MES={
 notif:()=>['Notifications',`<p class="sub1" style="margin-bottom:10px">Choose what you want to hear about. Alerts while the app is closed need your permission.</p>${rowsw('mega','Verified notices and strike updates','','n1',S.notif.n1)}${rowsw('chat','Replies and messages','','n2',S.notif.n2)}${rowsw('chat','The daily poll','','n3',S.notif.n3)}<div class="two" style="margin-top:10px"><button class="btn w sm" style="width:100%" data-act="allow">Allow alerts</button><button class="btn w sm" style="width:100%" data-act="testn">Send a test</button></div>`,sh=>{['n1','n2','n3'].forEach(k=>$('#'+k,sh).onchange=e=>S.notif[k]=e.target.checked)}],
 safe:()=>['Safety',`<div class="row"><span class="rx"><b>Blocked posters</b><small>${S.ud.blocked} blocked</small></span><button class="badge" data-act="unb">Unblock all</button></div><div class="row"><span class="rx"><b>Hidden stories</b><small>${S.ud.hidden} hidden</small></span><button class="badge" data-act="unh">Show again</button></div><button class="btn k" data-act="safety" style="margin-top:6px">Open safety tools</button>`],
 docs:()=>['Documentation',`<p class="sub1" style="margin-bottom:12px">A full guide to how Comrade Connect works, from posting and escrow to rewards and safety.</p>${[['Posting anonymously','Spill from the Feed. No name, no trace. Names, numbers and links are blocked.'],['Market and escrow','Money is held until you confirm. Platform fee 7%. Refunds reviewed by an admin.'],['Rewards','Earn points for stories, comments, check-ins and referrals. 50 points saves KSh 5 on a Market fee.'],['Safety','Block, hide and report. Emergency numbers are one tap away.']].map(d=>`<div class="card" style="padding:14px"><b>${d[0]}</b><p class="sub1" style="margin-top:4px">${d[1]}</p></div>`).join('')}<div class="two"><button class="btn w" data-act="closesheet">Close</button><button class="btn k" data-act="printdoc">Download PDF</button></div>`],
 remail:()=>['Recovery email',`<p class="sub1" style="margin-bottom:12px">Add an email so you can reset your password if you forget it. Signed in with Google? Your Google email is used automatically.</p>${field('Email','<input class="in" type="email" placeholder="you@example.com">')}<button class="btn k" data-act="saveemail">Add a recovery email</button>`],
 rcode:()=>['Recovery code',`<p class="sub1" style="margin-bottom:12px">It is the only way back into this account on a new phone. Save it somewhere safe and never share it.</p><div class="code" id="rcv">••••-••••-••••</div><div class="two" style="margin-top:12px"><button class="btn w" data-act="showcode">Show code</button><button class="btn w" data-act="copycode">Copy code</button></div>`],
 acct:()=>['Account',`<p class="sub1" style="margin-bottom:12px">${S.signed?'Signed in as @'+esc(S.handle):'You are browsing as a guest.'}</p><div class="stk"><button class="btn w" data-act="signin">Sign-in options</button><button class="btn w" data-act="tour">Take the tour</button><button class="btn w" data-act="cookies">Cookie settings</button><button class="btn k" data-act="signout">${ic('logout','s')} Sign out</button></div><p class="note">Signing out removes this account from this phone.</p>`],
 secure:()=>['Secure my account',`<p class="sub1" style="margin-bottom:12px">Lock Comrade Connect with your fingerprint or face unlock so only you can open it, even if someone borrows your phone. Your face and fingerprint never leave your phone.</p><button class="btn k" data-act="lockon">Lock with fingerprint or Face ID</button>`],
 verify:()=>['Verification',`<p class="sub1" style="margin-bottom:12px">${S.vpend?'Your request is under review.':'Get verified to withdraw money and earn a badge.'}</p>${field('I am a',sel('vr',['Student','Class rep','Hostel rep','Student leader']))}${field('Full name','<input class="in">')}${field('ID photo',`<button class="btn w" data-act="upl">${ic('plus','s')} Upload ID</button>`)}<button class="btn k" data-act="vsend">Get verified</button><button class="btn w" style="margin-top:10px" data-act="studemail">Verify with student email (optional)</button><p class="note"><a href="#" data-act="legal" data-arg="Safety">How we protect your money and identity</a></p>`],
 pk:()=>['Passkeys',`<p class="sub1" style="margin-bottom:12px">Sign in with your phone's fingerprint, face or screen lock. No password to remember.</p><p class="note" style="margin:0 0 12px">No passkeys on this account yet.</p><button class="btn k" data-act="addpk">Add a passkey</button>`],
 restore:()=>['Restore an account',`${field('Account ID or username','<input class="in" autocomplete="off">')}${field('Password or recovery code','<input class="in" type="password" autocomplete="off">')}<button class="btn k" data-act="rest">Restore</button><button class="btn w" style="margin-top:10px" data-act="addpk">Sign in with a passkey</button><p class="note">Use the account ID and recovery code you saved.</p>`]
};
A.mesheet=a=>{const [t,h,m]=MES[a]();openSheet(t,h,m)};
A.allow=()=>toast('Alerts allowed');A.testn=()=>toast('Test alert: this is how alerts will look');
A.unb=()=>{S.ud.blocked=0;POSTS.forEach(p=>p.hid=0);toast('Everyone unblocked')};A.unh=()=>{S.ud.hidden=0;POSTS.forEach(p=>p.hid=0);toast('Hidden stories are back')};
A.printdoc=()=>toast('PDF download works in the installed app');
A.saveemail=()=>{closeSheet();toast('Recovery email saved')};
A.showcode=()=>toast('Recovery code is not connected yet');A.copycode=()=>toast('Recovery code is not connected yet');
A.signin=()=>{closeSheet();S.signed?toast('Google, password and passkey are linked'):A.signup()};
/* Sign out: calls the real hook if it exists (CC.signOut -> Promise), then always clears the local session and opens the welcome gate. */
A.signout=()=>{closeSheet();const fin=()=>{S.signed=false;S.handle='';S.stack=[];hideLock();render();if(window.ccGate)ccGate.welcome()};let r=null;try{r=window.CC&&typeof CC.signOut==='function'?CC.signOut():null}catch(e){}Promise.resolve(r).then(fin,fin)};

const LEG={'Terms &amp; Conditions':'By using Comrade Connect you agree to keep it kind: no real names, no phone numbers, no hate. Market payments are held in escrow; the platform fee is 7% of a sale. Admins may remove content that breaks these rules.','Privacy Policy':'Your account is anonymous: no email, phone or name is needed. Your handle is never shown on posts. Face and fingerprint data never leave your phone. We use your campus to show local content.','Cookie Policy':'We use essential storage to keep you signed in and safe. Analytics and personalisation are optional and off by default. Change this any time in Cookie settings.','Refunds &amp; disputes':'Money is held in escrow. If an item is not as described, open a dispute from Orders. An admin reviews it and the 7-day refund period applies before referral rewards are paid.','About':'Comrade Connect is the anonymous campus app for Kenyan comrades. Owned and operated by Ogolla Tech, founded by Henry O. Odhiambo.','Safety':'Block, hide and report anytime. Emergency numbers and location sharing are in Safety tools. We protect your money with escrow and your identity with anonymous handles. Verification is optional and used only for withdrawals and badges.','Contact':'Reach us through Support, then Contact. Never share your M-Pesa PIN with anyone. Ogolla Tech, Kenya.'};
const LDOC={"terms": {"t": "Terms & Conditions", "i": "<p>Last updated 18 October 2026<\/p>", "s": [["1. Who we are", "<p>Comrade Connect is an anonymous campus feed, marketplace and community, run by <b data-t=\"operator.name\">comradeconnect<\/b>, <span data-t=\"operator.address\">Kerugoya, Kirinyaga, Kenya<\/span>. By using it you agree to these terms. Details of who we are and how we protect you: <a href=\"/trust.html\">Trust centre<\/a>.<\/p>"], ["2. Your account and who can join", "<p>Accounts are anonymous. You are responsible for keeping your recovery code safe. Anyone can join, whether or not they are a university student. Some things need more proof of who you are (see section 8). Hearts is for people aged 18 and over only.<\/p>"], ["3. What you may post", "<ul><li>No hate, threats, harassment, bullying or naming and shaming private people.<\/li><li>No phone numbers, emails, links or social handles in stories, listings or messages.<\/li><li>No weapons, drugs, alcohol, stolen goods, exam papers or anything illegal.<\/li><li>Do not film or share people without their consent.<\/li><\/ul>"], ["4. Market and payments", "<p>All payments for items sold through Comrade Connect must be made on Comrade Connect. Your money is held in escrow for that order and released to the seller when you give the seller your 6-digit handover code, tap that you received the item, the auto-release time passes with no dispute, or an admin decides a dispute. How the money is held, which payment gateway is used and what happens to late or failed payments is explained in <a href=\"/payments.html\">Payments, escrow and payouts<\/a>, which is part of these terms. Paying outside Comrade Connect, asking others to, or moving a deal off the platform is not allowed, and removes the protection of escrow and dispute help. Meet in public on campus in daytime and check the item first.<\/p>"], ["5. Fees and payouts", "<p>The seller pays a marketplace fee (currently <b data-t=\"fees.platform_fee_percent\" data-suf=\"%\">7%<\/b>) taken from the sale. Buyers pay the item price only. The fee on an order is fixed when the order is created, and changes apply to new orders only. Sale money and refunds are credited to your wallet. You may withdraw to your own M-Pesa number once you are ID verified, subject to the smallest amount and any withdrawal fee shown before you confirm. We aim to pay withdrawals within <b data-t=\"payouts.target_hours\" data-suf=\" hours\">24 hours<\/b>, which is a target and not a guarantee. We may delay a payout to check for fraud, a mistaken payment, an abusive account or a legal request, and we will tell you why unless the law stops us. Money in escrow or in your wallet is not a bank deposit and earns no interest.<\/p>"], ["6. Disputes and refunds", "<p>If something goes wrong, report a problem before you release payment. An admin reviews it within <b data-t=\"disputes.review_hours\" data-suf=\" hours\">48 hours<\/b> where possible and either refunds the buyer to their wallet or pays the seller. You may appeal once, within 7 days, by email. The admin decision is final inside Comrade Connect and does not remove any rights you have under Kenyan law. The full process is in <a href=\"/refunds.html\">Refunds and disputes<\/a>, which is part of these terms.<\/p>"], ["7. Hearts", "<p>Hearts is for dating and friendship only. Contact details are shared only after both people tap Interested and agree. Asking for money, airtime, fare or gifts is banned. Meet in a public place and tell a friend.<\/p>"], ["8. Student and ID verification", "<p>Verification is optional unless stated. A <b>verified student<\/b> badge needs a working email on an approved university domain (currently <b data-t=\"identity.student_domains\">kyu.ac.ke<\/b>). It shows only on Market listings, never on the feed. Withdrawing money needs <b>ID verification<\/b> with photos of a school ID checked by an admin. We keep only a scrambled fingerprint of a student email, not the address, and delete ID photos after the decision. A badge does not guarantee how a person will behave. You may remove your student badge at any time.<\/p>"], ["9. Rewards and Club", "<p>Points have no cash value and may change. Club membership is a paid access pass, not an investment, and does not guarantee income. Refunds follow the refund period shown when you join.<\/p>"], ["10. Enforcement", "<p>Automated checks and admins review content. We may remove content, give strikes, pause messaging, withhold rewards or suspend accounts that break these rules. If we suspend an account, money it is owed for completed sales stays recorded and we will tell you how to claim it unless the law stops us.<\/p>"], ["11. Our responsibility", "<p>Sales are between buyer and seller. We are not the seller and cannot guarantee any item, person or story. To the extent the law allows, we are not liable for losses from deals or meetings between users. Nothing in these terms limits any right you have under Kenyan law that cannot be limited.<\/p>"], ["12. Law and changes", "<p>These terms follow the laws of Kenya. We may update them and will show the new date above. Changes to fees or to how escrow works apply to new orders only. Questions: support@comradeconnect.co.ke<\/p>\n<p class=\"small\"><span id=\"live\"><\/span><\/p>"]], "u": "/terms.html"}, "privacy": {"t": "Privacy Policy", "i": "<p>Last updated 18 October 2026<\/p>", "s": [["What we collect", "<ul><li>An anonymous handle and recovery code, with no name or email unless you choose Google sign-in.<\/li><li>Your stories, comments, listings, photos, videos and messages.<\/li><li>Your M-Pesa number, only to take payment and send payouts.<\/li><li>Survey answers (university, year, interests, how you heard about us).<\/li><li>If you ask to be verified: your role, admission or staff number, front and back photos of your school ID, the number read from its barcode and, for class and hostel reps, your group link. Only admins see these, only to confirm who you are.<\/li><li>If you verify as a student: your university email is used once to send you a code. We keep only a scrambled (keyed hash) fingerprint of it, not the address. An email delivery provider handles the message to deliver it.<\/li><li>Reports, strikes and basic device and usage information to keep the service safe.<\/li><\/ul>"], ["How we use it", "<p>To run the app, process payments, hold escrow, prevent fraud, enforce the rules and improve the service. Messages, posts and listings are checked automatically to catch contact sharing, scams and banned items, and admins may review flagged items.<\/p>"], ["Who sees it", "<p>Your handle is never shown on your stories. Other users never see your phone number. If you choose to share a number in Hearts, only that match sees it. We share data only with services that run the app, such as payments (M-Pesa and the payment gateway named in <a href=\"/payments.html\">Payments, escrow and payouts<\/a>), email delivery and hosting, or when the law requires it. Your student badge, if you choose it, shows only on your Market listings, never on the anonymous feed.<\/p><p>Fingerprint lock uses the security built into your phone. Your fingerprint never leaves your phone and we never receive it.<\/p>"], ["Keeping it", "<p>We keep data while your account is active and as long as needed for payments, disputes and legal duties, then delete or anonymise it.<\/p>"], ["Your rights", "<p>Under the Kenya Data Protection Act, 2019 you may ask to see, correct or delete your data, or object to its use. You may also complain to the Office of the Data Protection Commissioner. Write to support@comradeconnect.co.ke.<\/p>"], ["Age", "<p>Comrade Connect is for university and college students. Hearts is 18+ only.<\/p>"]], "u": "/privacy.html"}, "cookies": {"t": "Cookie Policy", "i": "<p>Last updated 15 October 2026<\/p>", "s": [["What we use", "<p><b>Essential<\/b> cookies and local storage keep you signed in and remember your theme, account, cart, orders and choices. The app cannot work without them.<\/p><p><b>Analytics<\/b> are optional. They help us see which features work and fix problems. They only run if you press Accept all.<\/p><p>We do not use advertising cookies.<\/p>"], ["Your choice", "<p>Change your choice any time in Me, then Cookie settings. You can also clear cookies and site data in your browser settings.<\/p>"]], "u": "/cookies.html"}, "refunds": {"t": "Refunds & disputes", "i": "<p>Money for marketplace items is held in escrow, so the seller is not paid until the buyer is satisfied. This page is the full dispute process: who can use it, what happens, how long it takes, and how to appeal. <span id=\"live\" class=\"small\">Standard terms shown.<\/span><\/p>\n<div class=\"card\"><p><b>In short.<\/b> Report a problem from the order, before the money is released. An admin reviews it within <b data-t=\"disputes.review_hours\" data-suf=\" hours\">48 hours<\/b>. The answer is either a refund to the buyer's wallet or payment to the seller. You can appeal once.<\/p><\/div>", "s": [["How escrow protects you", "<div class=\"card\"><p><b>1. Pay.<\/b> You pay on Comrade Connect. The money is held for your order, not sent to the seller.<\/p>\n<p><b>2. Hand over.<\/b> You get a 6-digit code. The seller marks the item as handed over.<\/p>\n<p><b>3. Confirm.<\/b> Give the code to the seller only after you have checked the item. The seller is then paid.<\/p>\n<p><b>4. Auto-release.<\/b> If the seller marked it handed over and you do not confirm or dispute within <b data-t=\"escrow.auto_release_days\" data-suf=\" days\">3 days<\/b>, the seller is paid.<\/p><\/div>\n<p>How the money is held, the payment gateway and all fees are in <a href=\"/payments.html\">Payments, escrow and payouts<\/a>.<\/p>"], ["Opening a dispute", "<ul><li><b>Who:<\/b> the buyer or the seller of that order.<\/li>\n<li><b>When:<\/b> any time before the money is released. After release, the order is closed, so do not give the code or tap \"I received it\" until you are sure.<\/li>\n<li><b>How:<\/b> open the order in Market and tap <b>Report a problem<\/b>. Say what went wrong in a few clear words. Do not write phone numbers, links or handles.<\/li>\n<li>Entering a wrong code 5 times also stops the order so you can dispute it.<\/li><\/ul>"], ["What happens next", "<div class=\"card\"><p><b>Step 1: Paused.<\/b> The order is frozen. Auto-release stops and nobody can release the money with the code. The money stays held.<\/p>\n<p><b>Step 2: Review.<\/b> An admin reads the reason and the order history (payment, handover, codes tried, dates). The admin may write to either side with questions. Please answer quickly: if one side stays silent, the admin decides with what is available.<\/p>\n<p><b>Step 3: Decision within <b data-t=\"disputes.review_hours\" data-suf=\" hours\">48 hours<\/b>.<\/b> The admin chooses one outcome:<\/p>\n<ul><li><b>Refund the buyer.<\/b> The full amount paid goes to the buyer's wallet. The listing becomes available again. The seller pays no fee.<\/li>\n<li><b>Pay the seller.<\/b> The seller is paid the sale amount minus the marketplace fee, as in a normal sale.<\/li><\/ul>\n<p><b>Step 4: Shown on the order.<\/b> The order's status changes to refunded or released, and the wallet shows the entry.<\/p><\/div>\n<p class=\"small\">If a dispute is very complex, or we need information from you, it can take longer. We will tell you why instead of leaving you waiting in silence.<\/p>"], ["What helps your case", "<ul><li>What you were told, what you got, and when.<\/li><li>Photos of the item as received (buyer) or as handed over (seller).<\/li><li>Whether the code was given, and when.<\/li><li>Do not send private data you do not need. Never send your M-Pesa PIN or recovery code.<\/li><\/ul>"], ["Appeals", "<ul><li>If you think the decision is wrong, email <a href=\"mailto:support@comradeconnect.co.ke\">support@comradeconnect.co.ke<\/a> within <b>7 days<\/b> of the decision. Put the order number in the subject and add anything new.<\/li>\n<li>Where we have more than one admin, a different admin looks at the appeal.<\/li>\n<li>The decision on appeal is final inside Comrade Connect. It does not remove any rights you have under Kenyan law.<\/li><\/ul>"], ["False or abusive disputes", "<p>Opening disputes to get an item for free, threatening the other person, or lying to an admin breaks the <a href=\"/terms.html\">Terms<\/a>. It can lead to strikes, withheld rewards or a suspended account.<\/p>"], ["Where refunds go", "<p>A refund is credited to the buyer's Comrade Connect wallet as soon as the admin decides. Withdrawing the wallet to M-Pesa is done by our team, and needs an ID verified account. Fees and timing are on <a href=\"/payments.html\">Payments, escrow and payouts<\/a>.<\/p>"], ["Fees", "<p>The marketplace fee (currently <b data-t=\"fees.platform_fee_percent\" data-suf=\"%\">7%<\/b>) is taken from the seller's payout, and is shown before a sale is confirmed. Buyers do not pay it. A refunded order carries no fee.<\/p>"], ["Payments that were not completed", "<p>A payment that is not confirmed expires after <b data-t=\"payments.unconfirmed_expiry_minutes\" data-suf=\" minutes\">30 minutes<\/b> and no order is created. If you paid and nothing happened, keep your M-Pesa message and send us the code. If the money arrives late, it is reviewed by a person and never simply lost.<\/p>"], ["Club items and event tickets", "<p>The refund period for Club memberships and tickets is shown before you pay.<\/p>"], ["Still stuck?", "<p>Email <a href=\"mailto:support@comradeconnect.co.ke\">support@comradeconnect.co.ke<\/a> with your order number and what happened. See <a href=\"/contact.html\">Contact<\/a> and the <a href=\"/trust.html\">Trust centre<\/a>.<\/p>"]], "u": "/refunds.html"}, "about": {"t": "About", "i": "<p>Comrade Connect brings the things comrades already do every day into one place: talking about campus life, buying and selling, finding a room, and finding people to study with. It opens in your phone browser, so there is nothing to download.<\/p>", "s": [["What you can do", "<div class=\"card\"><b>Feed.<\/b> Post and read campus stories without your name on them. Filter by zone and category.<\/div>\n<div class=\"card\"><b>Market.<\/b> Buy and sell items between comrades. Admins check every listing, and the buyer's money is held in escrow until the item is handed over.<\/div>\n<div class=\"card\"><b>Hearts.<\/b> A separate 18+ space for meeting people, with private chats that open only after a match.<\/div>\n<div class=\"card\"><b>Roommates, study groups and hostel reviews.<\/b> Find a room or a roommate, join a study group, and read what other comrades say about hostels and zones.<\/div>\n<div class=\"card\"><b>Club shop and event tickets.<\/b> Buy club items and tickets to campus events, with a code checked at the door.<\/div>\n<div class=\"card\"><b>Host your own event.<\/b> Throwing a party or a show? Create an event, sell tickets in the app, and give your door team a private scan link to check guests in. Your ticket earnings go to your wallet.<\/div>"], ["How it keeps people safe", "<ul>\n<li>Messages between people are anonymous, and phone numbers and links are blocked.<\/li>\n<li>Comrades can mute, block and report any message, post or clip.<\/li>\n<li>Marketplace listings are approved by an admin before anyone can see them.<\/li>\n<li>Payments go through the escrow flow, so money is released only after the buyer confirms.<\/li>\n<\/ul>"], ["The team", "<p>Comrade Connect was founded by <b>Henry O. Odhiambo<\/b>, Founder and CEO of Ogolla Tech. It is built and run by Ogolla Tech. Christian N. and Peter M. are the developers.<\/p>\n<div class=\"card\"><b>Henry O. Odhiambo<\/b><br>Founder and CEO, Ogolla Tech<\/div>\n<div class=\"card\"><b>Christian N.<\/b><br>Developer<\/div>\n<div class=\"card\"><b>Peter M.<\/b><br>Developer<\/div>"], ["Common questions", "<p><b>Who founded Comrade Connect?<\/b> Henry O. Odhiambo, Founder and CEO of Ogolla Tech, founded Comrade Connect. Christian N. and Peter M. are the developers.<\/p>\n<p><b>Is Comrade Connect free?<\/b> Using the app is free. The marketplace takes a small fee from each sale, shown before you confirm.<\/p>\n<p><b>Do I need an account?<\/b> You can read the Feed without one. An account is created the first time you buy, sell or send a message.<\/p>\n<p><b>Who is it for?<\/b> Comrades at Kirinyaga University.<\/p>\n<p><a class=\"cta\" href=\"/\">Open Comrade Connect<\/a><\/p>"]], "u": "/about.html"}, "safety": {"t": "Safety", "i": "", "s": [["Who you are talking to", "<ul><li>Posts and messages are anonymous. Phone numbers, links and social handles are blocked so nobody can be pulled off the platform.<\/li>\n<li>Marketplace listings are approved by an admin before anyone sees them.<\/li>\n<li>You can mute, block and report any post, message or clip. Admins review reports.<\/li><\/ul>"], ["Student verification (optional)", "<ul><li>Anyone can join. If you are a university student you can confirm it with a code sent to your university email (for example @kyu.ac.ke). <a href=\"/student-verify.html\">Verify as a student<\/a>.<\/li>\n<li>Your feed stays anonymous. The student badge shows only on Market listings.<\/li>\n<li>We keep a scrambled fingerprint of the email, not the address, and you can remove the badge any time.<\/li><\/ul>"], ["ID verification", "<ul><li>Comrades can ask for a verified badge by sending their role, admission or staff number and photos of their school ID.<\/li>\n<li>Only admins see those photos, only to confirm who the person is. They are not shown to other users.<\/li>\n<li>Withdrawing money from the wallet needs a verified account.<\/li><\/ul>"], ["Payments", "<p>Payments are held in escrow until the buyer confirms. Paying outside the app removes that protection, so never do it. Read <a href=\"/refunds.html\">Refunds and disputes<\/a> and <a href=\"/payments.html\">Payments, escrow and payouts<\/a>.<\/p>"], ["Age", "<p>Comrade Connect is for university and college students. Hearts is 18+ and relies on a self-declaration, not an age check.<\/p>"], ["Report a problem", "<p>Use the report button in the app, or email <a href=\"mailto:support@comradeconnect.co.ke\">support@comradeconnect.co.ke<\/a>. If anyone is in danger, call 999 or 112.<\/p>"]], "u": "/safety.html"}, "contact": {"t": "Contact", "i": "<div class=\"card\"><p><b>Run by:<\/b> comradeconnect<\/p><p><b>Email:<\/b> <a href=\"mailto:support@comradeconnect.co.ke\">support@comradeconnect.co.ke<\/a><\/p><p><b>Phone / WhatsApp:<\/b> 0720170794<\/p><p><b>Based in:<\/b> Kerugoya, Kenya [Kirinyaga, Kenya<\/p><\/div>", "s": [["What to write about", "<ul><li>Orders and refunds: send the order number. See <a href=\"/refunds.html\">Refunds and disputes<\/a>.<\/li><li>Report abuse or a scam listing: include what you saw.<\/li><li>Data requests (see, correct or delete your data): see our <a href=\"/privacy.html\">Privacy Policy<\/a>.<\/li><li>Security problem: write \"Security\" in the subject.<\/li><\/ul>"]], "u": "/contact.html"}};
const LKEY={'terms & conditions':'terms','terms':'terms','privacy policy':'privacy','privacy':'privacy','cookie policy':'cookies','cookies':'cookies','refunds & disputes':'refunds','refunds':'refunds','about':'about','safety':'safety','contact':'contact'};
const lkey=a=>LKEY[String(a||'').replace(/&amp;/g,'&').toLowerCase()]||'terms';
SUB.legal=k=>{const d=LDOC[k]||LDOC.terms;
 return `${back(d.t,'Comrade Connect')}
 <div class="chips ldn">${Object.keys(LDOC).map(x=>`<button class="chip sm ${x===k?'on':''}" data-act="legalto" data-arg="${x}">${LDOC[x].t}</button>`).join('')}</div>
 <article class="ldoc">${d.i}${d.s.map((x,n)=>`<section><h2><i>${n+1}</i>${x[0]}</h2>${x[1]}</section>`).join('')}
 ${k==='safety'?'<button class="btn k" style="margin-top:18px" data-act="safety">Emergency contacts</button>':''}
 <p class="note" style="margin-top:20px">Owned and operated by Ogolla Tech, founded by Henry O. Odhiambo. <a href="${d.u}" target="_blank" rel="noopener">Open the web version</a></p></article>`};
A.legal=a=>{closeSheet();const k=lkey(a),top=S.stack[S.stack.length-1];if(top&&top.name==='legal'){top.arg=k;refresh();$('#sub').scrollTop=0}else{push('legal',k)}};
A.legalto=a=>{const top=S.stack[S.stack.length-1];if(top&&top.name==='legal'){top.arg=a;render();$('#sub').scrollTop=0}};
A.getapp=()=>openSheet('Get the app',`<p class="sub1" style="margin-bottom:12px">Install Comrade Connect on Android in three steps.</p>${['Download the latest APK','Allow installs from this source when asked','Open Comrade Connect and sign in'].map((t,i)=>`<div class="row"><span class="ri" style="font-weight:800">${i+1}</span><span class="rx"><b>${t}</b></span></div>`).join('')}<button class="btn o" data-act="closesheet">Download the app</button><button class="btn w" style="margin-top:10px" data-act="share" data-arg="Comrade Connect">Share the app link</button>`);
A.mkq=()=>{};

/* ===== GATE, LOCK, SIGN-UP ===== */
function lockHtml(page){
 if(page==='gate')return `<div style="margin-top:6px"><div class="gb b1" style="height:330px;border-radius:36px;box-shadow:var(--sh)"></div><h1 style="font-size:40px;letter-spacing:-.045em;line-height:1;margin:22px 0 8px">Spill it.<br>Nobody will know.</h1><p class="sub1" style="margin-bottom:20px">The anonymous campus app for Kenyan comrades.</p><div class="stk"><button class="btn k" data-act="gstart">Get started</button><button class="btn w" data-act="glogin">Log in</button></div></div>`;
 if(page==='bio'){const face=S.lock.faceMode,nm=((S.handle||'').split('_')[0])||'comrade';return `<div class="ctr fp"><div class="fp-av gb b1">${esc(nm[0].toUpperCase())}</div><h2 style="font-size:26px;letter-spacing:-.03em;margin-top:14px">Hi, ${esc(nm.toUpperCase())}</h2><p class="sub1">Welcome back</p><button class="fpad" id="orb" aria-label="Unlock"><span class="glyph" id="fpg">${ic(face?'face':'finger')}</span></button><b id="fpt" style="display:block;font-size:17px">${face?'Look at your phone to unlock':'Touch the sensor to unlock'}</b><p class="sub1" id="fps" style="margin-top:4px">Tap the circle to unlock</p><div class="seg" style="max-width:260px;margin:18px auto"><button class="${face?'':'on'}" data-act="bmode" data-arg="f">${ic('finger','s')} Fingerprint</button><button class="${face?'on':''}" data-act="bmode" data-arg="x">${ic('face','s')} Face ID</button></div><div class="stk"><button class="btn w" id="fpw" data-act="lpw">Sign in with my password</button></div><p class="note" style="margin-top:16px"><a href="#" data-act="lswitch" style="font-weight:800">Switch account</a> / <a href="#" data-act="support2" style="font-weight:800">Need help?</a></p></div>`}
 if(page==='pw')return `<div style="margin-top:50px"><h2 style="font-size:28px;letter-spacing:-.03em;margin-bottom:6px">Enter your password</h2><p class="sub1" style="margin-bottom:20px">@${esc(S.handle)}</p>${field('Password','<div style="position:relative"><input class="in" id="lpwi" type="password" autocomplete="current-password"><button class="rb sm" id="eye" style="position:absolute;right:8px;top:8px" aria-label="Show password">'+ic('eye','s')+'</button></div>')}<p style="text-align:right;margin:-4px 8px 16px"><a href="#" data-act="lforgot" style="font-weight:800;font-size:13px">Forgot your password?</a></p><div style="display:flex;gap:10px"><button class="btn k" id="lcont" disabled>Continue</button><button class="rb" style="width:54px;height:54px" data-act="lbio" aria-label="Use fingerprint">${ic('finger')}</button></div></div>`;
 if(page==='forgot')return `<div class="ctr"><div class="lk-top"><button class="rb sm" data-act="lpw" aria-label="Back">${ic('back','s')}</button><button class="rb sm" data-act="lpw" aria-label="Cancel">${ic('x','s')}</button></div><div class="otp-ic gb b1">${ic('key')}</div><h2 style="font-size:28px;letter-spacing:-.03em;margin-top:18px">Reset password</h2><p class="sub1" style="margin:6px 0 20px">Enter the email saved on your account. We will send you a 6-digit code.</p><div style="text-align:left">${field('Email','<input class="in" id="fem" type="email" placeholder="you@example.com" autocomplete="email">')}</div><button class="btn k" data-act="lsendcode">Send code</button><button class="btn w" style="margin-top:10px" data-act="lpw">Back to log in</button><p class="note" style="margin-top:16px">No email saved? Use Restore an account with your recovery code, or contact support.</p></div>`;

const STEPS=[['feed','The Feed','This is home. Read stories, filter by zone or category, and tap the Spill button to post. Nobody will know it was you.'],['videos','Videos','Watch short campus clips here and share the good ones.'],['live','Live','See what is happening on campus right now.'],['market','Market','Buy and sell safely. Your money stays in escrow until you confirm the item with your 6-digit handover code.'],['explore','Explore','Find roommates and study groups, vote in polls, and meet people on Hearts (18+).'],['rewards','Rewards','Check in daily, spill, comment and share to earn points. Spend them on boosts and perks.'],['me','Me','Your anonymous account. Save your recovery code here. You will also find the full documentation, which you can download as a PDF.']];

const SV='<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M24 5v6"/><circle cx="24" cy="4.5" r="2" fill="currentColor"/><rect x="8" y="11" width="32" height="24" rx="9"/><path d="M4 21v6M44 21v6"/><ellipse class="tke" cx="18" cy="22" rx="2.6" ry="3.4" fill="currentColor" stroke="none"/><ellipse class="tke" cx="30" cy="22" rx="2.6" ry="3.4" fill="currentColor" stroke="none"/><path d="M18 29c3 2.4 9 2.4 12 0"/><path d="M16 35v5h16v-5"/></svg>';
q('#tkr').innerHTML=SV;let si=0,seen=false;
const MAP={feed:['home'],videos:['watch','clips'],live:['watch','live'],market:['market'],explore:['explore'],rewards:['rewards'],me:['me']};
const clr=()=>document.querySelectorAll('.tkh').forEach(x=>x.classList.remove('tkh'));
const head=t=>'<div class="tk-h"><span class="tk-av">'+SV+'</span><b class="tk-t">'+t+'</b><button type="button" class="tk-x" data-a="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
const show=h=>{b.innerHTML=h;b.classList.add('on')},hide=()=>{b.classList.remove('on');clr()};
const menu=first=>{clr();show(head(first?'Hi comrade, I am Tech':'Need a hand?')+'<p class="tk-p">I am your guide. I can show you around the app, or you can read the full documentation.</p><div class="tr"><button class="btn k sm" data-a="support">Ask support</button><button class="btn w sm" data-a="go">Start tour</button><button class="btn w sm" data-a="doc">Read docs</button><button class="btn w sm" data-a="x">Not now</button></div>')};
const step=()=>{const s=STEPS[si],m=MAP[s[0]];clr();closeSheet();
 if(m[0]==='rewards'){S.stack=[];S.tab='me';push('rewards')}else{if(m[1])S.wTab=m[1];go(m[0])}
 const t=document.querySelector('#nav [data-arg="'+(m[0]==='rewards'?'me':m[0])+'"]');if(t)t.classList.add('tkh');
 show(head(s[1])+'<p class="tk-p">Step '+(si+1)+' of '+STEPS.length+'. '+s[2]+'</p><div class="tr s">'+(si?'<button class="btn w sm" data-a="back">Back</button>':'')+'<button class="btn k sm" data-a="next">'+(si===STEPS.length-1?'Finish':'Next')+'</button><button class="btn w sm" data-a="x">Skip</button></div>')};
const docs=()=>openSheet('Documentation',DOCS.map(s=>'<h3 class="dh">'+esc(s[0])+'</h3>'+s[1].split('\n').map(t=>'<p class="sub1" style="margin-bottom:8px">'+esc(t)+'</p>').join('')).join('')+'<div class="stk" style="margin-top:14px"><button class="btn k" id="tkpdf">Download PDF</button><button class="btn w" data-act="closesheet">Close</button></div>',sh=>{sh.querySelector('#tkpdf').onclick=pdf});
function pdf(){const J=window.jspdf;if(!J){toast('PDF tool is still loading. Check your connection and try again.');return}
 const d=new J.jsPDF({unit:'mm',format:'a4'}),W=210,M=16,mw=W-2*M;let y=50;
 d.setFillColor(0,0,0);d.rect(0,0,W,38,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(20);d.text('COMRADE CONNECT',M,20);d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(190);d.text('Full documentation',M,27);
 const need=n=>{if(y+n>282){d.addPage();y=20}};
 DOCS.forEach(s=>{need(24);y+=4;d.setTextColor(0);d.setFont('helvetica','bold');d.setFontSize(13);d.text(s[0],M,y);y+=7;d.setFont('helvetica','normal');d.setFontSize(10.5);d.setTextColor(60);
  s[1].split('\n').forEach(t=>{d.splitTextToSize(t,mw).forEach(l=>{need(6);d.text(l,M,y);y+=5.3});y+=2})});
 try{d.save('Comrade-Connect-Documentation.pdf')}catch(e){toast('Could not save the PDF here. It works in the installed app.')}}
b.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
 if(k==='go'){si=0;step()}else if(k==='next'){if(si<STEPS.length-1){si++;step()}else{hide();go('home')}}else if(k==='back'){si--;step()}
 else if(k==='doc'){hide();docs()}else if(k==='support'){hide();S.stack=[];push('support')}else hide()});
q('#tkr').onclick=()=>{b.classList.contains('on')?hide():(menu(!seen),seen=true)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
})();

 const th=ls.get('cc_theme',null);if(th)document.documentElement.dataset.theme=th;

 const skip=/#app/.test(location.hash);
 window.ccAfterGate=()=>{S.signed=true;refresh();toast('Welcome, comrade')};
})();
</script>

 go.onclick=async function(){

function askCode(id,man){
 return new Promise(function(res,rej){
  openSheet('Pay with M-Pesa','<div class="card" style="margin-bottom:12px"><div class="eyebrow">Send exactly</div><div style="font-size:34px;font-weight:800;letter-spacing:-.04em">'+kes(man.amount)+'</div><p class="note">'+esc(man.steps)+(man.name?'<br>Name M-Pesa shows: <b>'+esc(man.name)+'</b>':'')+'</p></div>'
   +(man.pay_to?'<button class="btn w" id="mpcp" style="width:100%;margin-bottom:12px">Copy '+(man.type==='send'?'number':man.type==='till'?'till number':'business number')+'</button>':'')
   +field('M-Pesa code (10 characters from the message)','<input class="in" id="mpc" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="SJK7ABC123">')
   +'<p class="note" id="mpe"></p><button class="btn o" id="mpg">I have paid</button>',function(sh){
   var cp=$('#mpcp',sh);if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(man.pay_to);toast('Copied')}catch(e){}};
   var busy=false,done=false;
   var watch=setInterval(function(){if(!done&&!$('#mpg')){clearInterval(watch);rej(new Error('Payment not finished. If you already paid, buy again and enter the M-Pesa code.'))}},500);
   $('#mpg',sh).onclick=async function(){
    if(busy)return;
    var code=$('#mpc',sh).value.toUpperCase().replace(/[\s-]/g,'');
    if(!/^[A-Z0-9]{10}$/.test(code)){$('#mpe',sh).textContent='The code has 10 letters and numbers, like SJK7ABC123.';return}
    busy=true;$('#mpe',sh).textContent='';
